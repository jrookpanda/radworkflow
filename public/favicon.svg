<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="radGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="radGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#radGrad)" />
  <!-- Top Stopwatch Button & Crown -->
  <rect x="29" y="7" width="6" height="5" rx="1.5" fill="#ffffff" />
  <path d="M25 12 L39 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Side Lap Pusher -->
  <path d="M45 17 L49 13" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <!-- Main Stopwatch Face Outer Shadow -->
  <circle cx="32" cy="36" r="19" fill="#0f172a" filter="url(#radGlow)" />
  <!-- Cyan Accent Ring -->
  <circle cx="32" cy="36" r="16.5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.85" />
  <!-- Dial 12, 3, 6, 9 Ticks -->
  <circle cx="32" cy="22" r="1.2" fill="#f8fafc" />
  <circle cx="46" cy="36" r="1.2" fill="#f8fafc" />
  <circle cx="32" cy="50" r="1.2" fill="#f8fafc" />
  <circle cx="18" cy="36" r="1.2" fill="#f8fafc" />
  <!-- Moving Stopwatch Hand (Emerald Accent) -->
  <line x1="32" y1="36" x2="42" y2="26" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  <!-- Center Pivot Pin -->
  <circle cx="32" cy="36" r="3.2" fill="#ffffff" />
  <circle cx="32" cy="36" r="1.6" fill="#0f172a" />
</svg>
