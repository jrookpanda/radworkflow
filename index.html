                                    <div className="grid grid-cols-4 gap-2">
                                        {['OPD', 'IPD', 'ER', 'VIP'].map((type) => (
                                            <button
                                                key={type}
                                                type="button"
                                                onClick={() => { triggerHaptic(20); setFormData({...formData, patientType: type}); }}
                                                className={`py-2.5 rounded-xl text-xs font-extrabold border transition ${
                                                    formData.patientType === type
                                                        ? type === 'ER' ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-900 text-white border-slate-900'
                                                        : 'bg-white text-slate-600 border-slate-200'
                                                }`}
                                            >
                                                {type === 'ER' ? '🚨 ER' : type}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Shift Selection */}
                                <div className="space-y-2">
                                    <label className="block text-xs font-black text-slate-800 tracking-wide uppercase">
                                        5. Shift Schedule
                                    </label>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                        {[
                                            'Morning (7:30 AM - 12:00 PM)',
                                            'Afternoon (12:00 PM - 7:00 PM)',
                                            'Overnight (7:00 PM - 7:30 AM)'
                                        ].map((s) => (
                                            <button
                                                key={s}
                                                type="button"
                                                onClick={() => { triggerHaptic(20); setFormData({...formData, shift: s, isShiftOverridden: true}); }}
                                                className={`p-2.5 rounded-xl text-xs font-bold border transition text-left ${
                                                    formData.shift === s
                                                        ? 'bg-indigo-50 border-indigo-500 text-indigo-950 ring-2 ring-indigo-500/20'
                                                        : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'
                                                }`}
                                            >
                                                <i className="fa-regular fa-clock text-indigo-600 mr-1.5"></i>
                                                <span>{s.split(' ')[0]}</span>
                                                <span className="block text-[10px] text-slate-400 font-normal">{s.split(' ').slice(1).join(' ')}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Launch Button */}
                                <button
                                    type="submit"
                                    className="w-full py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white font-black text-base rounded-2xl shadow-lg shadow-sky-500/25 active:scale-98 transition flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-play"></i>
                                    <span>START STUDY OBSERVATION</span>
                                </button>
                            </form>
                        </div>
                    )}

                    {/* Live Tracking View */}
                    {view === 'tracking' && trackingSession && (
                        <div className="space-y-4 my-auto">
                            {/* Active Step Stopwatch Display */}
                            <div className="bg-slate-900 text-white rounded-3xl p-6 shadow-2xl border border-slate-800 relative overflow-hidden">
                                <div className="flex items-center justify-between text-xs border-b border-slate-800 pb-3 mb-4">
                                    <div className="flex items-center space-x-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                                        <span className="font-mono font-bold text-slate-300">{trackingSession.patientId}</span>
                                    </div>
                                    <div className="flex gap-1.5">
                                        <span className="px-2.5 py-0.5 rounded-full bg-sky-950 text-sky-300 border border-sky-800 text-[10px] font-bold">
                                            {trackingSession.modality}
                                        </span>
                                        <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                                            trackingSession.hasContrast ? 'bg-purple-950 text-purple-300 border border-purple-800' : 'bg-slate-800 text-slate-300'
                                        }`}>
                                            {trackingSession.hasContrast ? 'IV Contrast' : 'Plain'}
                                        </span>
                                    </div>
                                </div>

                                <div className="text-center my-2">
                                    <div className="text-xs uppercase tracking-widest text-sky-400 font-extrabold mb-1">
                                        Step {trackingSession.currentStepIndex + 1} of {trackingSession.stepLogs.length}
                                    </div>
                                    <h2 className="text-xl sm:text-2xl font-black text-white">
                                        {trackingSession.stepLogs[trackingSession.currentStepIndex]?.stepName}
                                    </h2>
                                </div>

                                {/* Active Timer Counter */}
                                <div className="my-5 text-center bg-slate-950/80 rounded-2xl p-4 border border-slate-800 backdrop-blur-md">
                                    <div className="text-[10px] uppercase font-semibold text-slate-400 mb-1">Active Step Stopwatch</div>
                                    <div className="text-5xl font-mono font-extrabold text-sky-400 tracking-wider">
                                        {formatDuration(
                                            Math.max(0, Math.floor((now - new Date(trackingSession.stepLogs[trackingSession.currentStepIndex]?.startTime).getTime()) / 1000))
                                        )}
                                    </div>
                                </div>

                                {/* Quick Bottleneck Tagging Chips */}
                                <div className="space-y-2 pt-2 border-t border-slate-800">
                                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Tap Bottlenecks:</div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {QUICK_BOTTLENECKS.map(tag => {
                                            const isSelected = (trackingSession.resources?.bottleneckNotes || '').includes(tag);
                                            return (
                                                <button
                                                    key={tag}
                                                    type="button"
                                                    onClick={() => handleToggleBottleneck(tag)}
                                                    className={`px-3 py-1.5 text-xs rounded-xl font-bold transition active:scale-95 ${
                                                        isSelected 
                                                            ? 'bg-amber-500 text-slate-950 font-black shadow-md' 
                                                            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                                                    }`}
                                                >
                                                    {isSelected ? '✓ ' : '+ '}{tag}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* Step Progression List */}
                            <div className="bg-white/90 backdrop-blur-md rounded-3xl p-4 border border-slate-200/80 shadow-card space-y-2">
                                <div className="text-xs font-black text-slate-500 uppercase tracking-wider mb-3">
                                    Workflow Progression
                                </div>

                                <div className="space-y-2">
                                    {trackingSession.stepLogs.map((log, idx) => {
                                        const isActive = idx === trackingSession.currentStepIndex;
                                        const isDone = log.status === 'completed';
                                        
                                        let durationDisp = '00:00';
                                        if (isDone) {
                                            durationDisp = formatDuration(log.durationSeconds);
                                        } else if (isActive) {
                                            durationDisp = formatDuration(Math.max(0, Math.floor((now - new Date(log.startTime).getTime()) / 1000)));
                                        }

                                        return (
                                            <div
                                                key={log.stepId}
                                                className={`p-3 rounded-2xl border transition flex items-center justify-between ${
                                                    isActive
                                                        ? 'bg-sky-50 border-sky-500 ring-2 ring-sky-500/20'
                                                        : isDone
                                                        ? 'bg-slate-50 border-slate-200 opacity-90'
                                                        : 'bg-slate-50/40 border-dashed border-slate-200 opacity-50'
                                                }`}
                                            >
                                                <div className="flex items-center space-x-3">
                                                    <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs ${
                                                        isDone ? 'bg-emerald-500 text-white' :
                                                        isActive ? 'bg-sky-600 text-white pulse-subtle' :
                                                        'bg-slate-200 text-slate-500'
                                                    }`}>
                                                        {isDone ? <i className="fa-solid fa-check"></i> : <i className={`fa-solid ${log.icon}`}></i>}
                                                    </div>
                                                    <div>
                                                        <div className="font-extrabold text-xs text-slate-800">
                                                            {log.stepName}
                                                        </div>
                                                        <div className="text-[10px] font-semibold text-slate-400">
                                                            {log.stepType === 'hands_on' ? 'Hands-On Patient Care' : 'Post-Patient Console Work'}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="font-mono font-extrabold text-xs text-slate-800">
                                                    {durationDisp}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Sticky Action Controls */}
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={handleUndoLastStep}
                                    disabled={trackingSession.currentStepIndex === 0}
                                    className="px-4 py-4 bg-white border border-slate-200 text-slate-700 font-bold rounded-2xl disabled:opacity-40 active:scale-95 transition text-xs flex items-center space-x-1"
                                >
                                    <i className="fa-solid fa-rotate-left"></i>
                                    <span>Undo</span>
                                </button>

                                <button
                                    onClick={handleTapStepComplete}
                                    className="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black text-sm rounded-2xl shadow-lg shadow-emerald-600/30 active:scale-98 transition flex items-center justify-center space-x-2"
                                >
                                    <span>
                                        {trackingSession.currentStepIndex === trackingSession.stepLogs.length - 1 
                                            ? 'FINISH OBSERVATION & LOG RESOURCES' 
                                            : `COMPLETE STEP ${trackingSession.currentStepIndex + 1}`}
                                    </span>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Resource Usage Form View */}
                    {view === 'resources' && trackingSession && (
                        <div className="bg-white/90 backdrop-blur-md rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-card my-auto space-y-4">
                            <div className="border-b border-slate-100 pb-3">
                                <h2 className="text-base font-black text-slate-900">Study Consumables & Staffing</h2>
                                <p className="text-xs text-slate-500">Tap buttons to quickly adjust counts</p>
                            </div>

                            <form onSubmit={handleSaveResources} className="space-y-4">
                                
                                {/* Films Printed Touch Stepper */}
                                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/60">
                                    <label className="block text-xs font-bold text-slate-700 mb-2">Films Printed</label>
                                    <div className="flex items-center justify-between gap-3">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                triggerHaptic(25);
                                                const current = trackingSession.resources.filmsPrinted || 0;
                                                setTrackingSession({
                                                    ...trackingSession,
                                                    resources: { ...trackingSession.resources, filmsPrinted: Math.max(0, current - 1) }
                                                });
                                            }}
                                            className="w-14 h-14 bg-white border-2 border-slate-200 hover:border-brand-500 rounded-2xl text-xl font-black text-slate-700 shadow-sm active:scale-90 transition flex items-center justify-center"
                                        >
                                            <i className="fa-solid fa-minus"></i>
                                        </button>

                                        <div className="flex-1 text-center bg-white py-3 rounded-2xl border border-slate-200 shadow-inner">
                                            <span className="text-2xl font-mono font-black text-brand-600">
                                                {trackingSession.resources.filmsPrinted}
                                            </span>
                                            <span className="block text-[10px] uppercase font-bold text-slate-400">Sheets</span>
                                        </div>

                                        <button
                                            type="button"
                                            onClick={() => {
                                                triggerHaptic(25);
                                                const current = trackingSession.resources.filmsPrinted || 0;
                                                setTrackingSession({
                                                    ...trackingSession,
                                                    resources: { ...trackingSession.resources, filmsPrinted: current + 1 }
                                                });
                                            }}
                                            className="w-14 h-14 bg-white border-2 border-slate-200 hover:border-brand-500 rounded-2xl text-xl font-black text-slate-700 shadow-sm active:scale-90 transition flex items-center justify-center"
                                        >
                                            <i className="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>

                                {/* Film Size selector */}
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1.5">Film Size Format</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['14x17', '10x12', '8x10', 'Digital-Only'].map((sz) => (
                                            <button
                                                key={sz}
                                                type="button"
                                                onClick={() => { triggerHaptic(20); setTrackingSession({...trackingSession, resources: {...trackingSession.resources, filmSize: sz}}); }}
                                                className={`py-3 px-3 rounded-xl text-xs font-bold border transition ${
                                                    trackingSession.resources.filmSize === sz
                                                        ? 'bg-brand-600 text-white border-brand-600 shadow-sm'
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                }`}
                                            >
                                                {sz}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    {/* Tech Count Stepper */}
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/60">
                                        <label className="block text-xs font-bold text-slate-700 mb-2">Technologists</label>
                                        <div className="flex items-center justify-between gap-2">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    triggerHaptic(20);
                                                    const cur = trackingSession.resources.techCount || 1;
                                                    setTrackingSession({...trackingSession, resources: {...trackingSession.resources, techCount: Math.max(1, cur - 1)}});
                                                }}
                                                className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center"
                                            >
                                                <i className="fa-solid fa-minus"></i>
                                            </button>
                                            <span className="text-lg font-mono font-black text-slate-900">{trackingSession.resources.techCount}</span>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    triggerHaptic(20);
                                                    const cur = trackingSession.resources.techCount || 1;
                                                    setTrackingSession({...trackingSession, resources: {...trackingSession.resources, techCount: cur + 1}});
                                                }}
                                                className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center"
                                            >
                                                <i className="fa-solid fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Nurse Count Stepper */}
                                    <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/60">
                                        <label className="block text-xs font-bold text-slate-700 mb-2">Nurses / Staff</label>
                                        <div className="flex items-center justify-between gap-2">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    triggerHaptic(20);
                                                    const cur = trackingSession.resources.nurseCount || 0;
                                                    setTrackingSession({...trackingSession, resources: {...trackingSession.resources, nurseCount: Math.max(0, cur - 1)}});
                                                }}
                                                className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center"
                                            >
                                                <i className="fa-solid fa-minus"></i>
                                            </button>
                                            <span className="text-lg font-mono font-black text-slate-900">{trackingSession.resources.nurseCount}</span>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    triggerHaptic(20);
                                                    const cur = trackingSession.resources.nurseCount || 0;
                                                    setTrackingSession({...trackingSession, resources: {...trackingSession.resources, nurseCount: cur + 1}});
                                                }}
                                                className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center"
                                            >
                                                <i className="fa-solid fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Notes / Delay Observations</label>
                                    <textarea
                                        rows="2"
                                        value={trackingSession.resources.bottleneckNotes}
                                        onChange={(e) => setTrackingSession({
                                            ...trackingSession,
                                            resources: { ...trackingSession.resources, bottleneckNotes: e.target.value }
                                        })}
                                        placeholder="Note any patient delays, contrast reactions, or scanner recalibrations..."
                                        className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white transition"
                                    ></textarea>
                                </div>

                                <button
                                    type="submit"
                                    className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm rounded-2xl shadow-lg active:scale-98 transition flex items-center justify-center space-x-2"
                                >
                                    <i className="fa-solid fa-cloud-arrow-up"></i>
                                    <span>SAVE OBSERVATION & SYNC TO SHEETS</span>
                                </button>
                            </form>
                        </div>
                    )}

                    {/* Summary View */}
                    {view === 'summary' && trackingSession && (
                        <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 border border-slate-200/80 shadow-card my-auto space-y-5 text-center">
                            <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto shadow-inner">
                                <i className="fa-solid fa-circle-check"></i>
                            </div>

                            <div>
                                <h2 className="text-xl font-black text-slate-900">Study Completed & Logged!</h2>
                                <p className="text-xs text-slate-500 font-mono mt-1">ID: {trackingSession.id} | Accession: {trackingSession.patientId}</p>
                            </div>

                            <div className="grid grid-cols-3 gap-2 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
                                <div>
                                    <div className="text-[10px] font-bold text-slate-400 uppercase">Hands-On Time</div>
                                    <div className="text-base font-mono font-extrabold text-sky-600">
                                        {formatDuration(trackingSession.summaryMetrics?.handsOnDurationSec)}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-[10px] font-bold text-slate-400 uppercase">Console Time</div>
                                    <div className="text-base font-mono font-extrabold text-purple-600">
                                        {formatDuration(trackingSession.summaryMetrics?.postProcessingDurationSec)}
                                    </div>
                                </div>
                                <div>
                                    <div className="text-[10px] font-bold text-slate-400 uppercase">Total Study</div>
                                    <div className="text-base font-mono font-extrabold text-slate-900">
                                        {formatDuration(trackingSession.summaryMetrics?.totalDurationSec)}
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={handleStartNewPatient}
                                className="w-full py-4 bg-brand-600 hover:bg-brand-500 text-white font-black text-sm rounded-2xl shadow-lg active:scale-98 transition flex items-center justify-center space-x-2"
                            >
                                <i className="fa-solid fa-plus"></i>
                                <span>START NEXT PATIENT OBSERVATION</span>
                            </button>
                        </div>
                    )}

                    {/* History View */}
                    {view === 'history' && (
                        <div className="bg-white/90 backdrop-blur-md rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-card my-auto space-y-4">
                            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                <div>
                                    <h2 className="text-base font-black text-slate-900">Observation Logs ({history.length})</h2>
                                    <p className="text-xs text-slate-500">Stored locally & syncable to Google Sheets</p>
                                </div>

                                <div className="flex gap-1.5">
                                    <button
                                        onClick={handleManualSyncAll}
                                        className="px-3 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-xs active:scale-95 transition flex items-center space-x-1"
                                    >
                                        <i className="fa-solid fa-cloud-arrow-up"></i>
                                        <span>Sync All</span>
                                    </button>
                                    <button
                                        onClick={handleExportCSV}
                                        className="px-3 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl active:scale-95 transition flex items-center space-x-1"
                                    >
                                        <i className="fa-solid fa-file-csv"></i>
                                        <span>Export CSV</span>
                                    </button>
                                </div>
                            </div>

                            {/* Search & Modality Filters */}
                            <div className="grid grid-cols-2 gap-2">
                                <input
                                    type="text"
                                    placeholder="Search accession / station..."
                                    value={historySearch}
                                    onChange={(e) => setHistorySearch(e.target.value)}
                                    className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium"
                                />
                                <select
                                    value={historyFilterModality}
                                    onChange={(e) => setHistoryFilterModality(e.target.value)}
                                    className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"
                                >
                                    <option value="ALL">All Modalities</option>
                                    <option value="CT">CT Scan Only</option>
                                    <option value="XRay">X-Ray Only</option>
                                </select>
                            </div>

                            {/* History Record Cards */}
                            <div className="space-y-2.5 max-h-96 overflow-y-auto no-scrollbar pr-1">
                                {filteredHistory.length === 0 ? (
                                    <div className="p-8 text-center text-slate-400 text-xs italic">
                                        No observation logs found matching query.
                                    </div>
                                ) : (
                                    filteredHistory.map(item => (
                                        <div key={item.id} className="p-3.5 bg-slate-50/80 rounded-2xl border border-slate-200/80 space-y-2">
                                            <div className="flex items-center justify-between text-xs">
                                                <div className="flex items-center space-x-2">
                                                    <span className="font-mono font-extrabold text-slate-900">{item.patientId}</span>
                                                    <span className="px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 text-[10px] font-extrabold">
                                                        {item.modality}
                                                    </span>
                                                </div>
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                                    item.syncedToSheet ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                                }`}>
                                                    {item.syncedToSheet ? '✓ Synced' : 'Offline Pending'}
                                                </span>
                                            </div>

                                            <div className="grid grid-cols-3 gap-2 text-[11px] text-slate-600">
                                                <div>
                                                    <span className="text-slate-400 block">Total Duration</span>
                                                    <span className="font-mono font-bold text-slate-900">{formatDuration(item.summaryMetrics?.totalDurationSec)}</span>
                                                </div>
                                                <div>
                                                    <span className="text-slate-400 block">Anatomy</span>
                                                    <span className="font-semibold text-slate-800 truncate block">{item.bodyPart}</span>
                                                </div>
                                                <div>
                                                    <span className="text-slate-400 block">Station</span>
                                                    <span className="font-mono font-bold text-slate-800">{item.stationId}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
