<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radiology Time-Motion Study Tracker (CT & X-Ray)</title>
  <meta name="description" content="Workflow efficiency tracker for CT & X-Ray radiology procedures with QR scanning and Google Sheets synchronization." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome 6.4 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone (Runs JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- jsQR Library for barcode / QR code scanning from webcam -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      overscroll-behavior-y: none;
    }
    .bg-mesh {
      background-color: #f8fafc;
      background-image:
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
    }
    .pulse-subtle {
      animation: pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideOutLeft {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(-100%); opacity: 0; }
    }
    @keyframes slideInRight {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    .animate-slide-out-left {
      animation: slideOutLeft 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .animate-slide-in-right {
      animation: slideInRight 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="bg-mesh text-slate-800 antialiased min-h-full pb-20 sm:pb-10 selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

          { id: 's4', name: 'Patient Offboarding & Room Reset', type: 'hands_on', icon: 'fa-pump-soap' },
          { id: 's5', name: '3D Multi-Planar Recon (MPR)', type: 'post_patient', icon: 'fa-cubes' },
          { id: 's6', name: 'Multi-Frame Printing & Packaging', type: 'post_patient', icon: 'fa-images' },
          { id: 's7', name: 'Final Handover to Patient', type: 'post_patient', icon: 'fa-circle-check' }
        ]
      },
      'CT_WITH_CONTRAST': {
        name: 'CT Scan (With IV Contrast)',
        category: 'CT Scan',
        hasContrast: true,
        steps: [
          { id: 's1', name: 'Patient Intake & Renal Screening', type: 'hands_on', icon: 'fa-vial' },
          { id: 's2', name: 'IV Cannulation & Injector Setup', type: 'hands_on', icon: 'fa-syringe' },
          { id: 's3', name: 'Couch Positioning & Scout Setup', type: 'hands_on', icon: 'fa-crosshairs' },
          { id: 's4', name: 'Contrast Injection & Dynamic Scan', type: 'hands_on', icon: 'fa-heart-pulse' },
          { id: 's5', name: 'Line Removal & Reaction Watch', type: 'hands_on', icon: 'fa-user-nurse' },
          { id: 's6', name: 'Advanced 3D Recon (MPR/MIP/VRT)', type: 'post_patient', icon: 'fa-layer-group' },
          { id: 's7', name: 'Multi-Sheet Printing & Packaging', type: 'post_patient', icon: 'fa-print' },
          { id: 's8', name: 'Final Handover & Hydration Guidance', type: 'post_patient', icon: 'fa-bottle-water' }
        ]
      }
    };

    const XRAY_REGIONS = [
      { id: 'chest', label: 'Chest (1 view)', name: 'Chest (1 view)', views: 1, icon: 'fa-lungs' },
      { id: 'bones', label: 'Limbs & Spine', name: 'Bones / Limbs / Spines (2 views)', views: 2, icon: 'fa-bone' },
      { id: 'fluoro', label: 'Fluoroscopy', name: 'Fluoroscopy (6 views)', views: 6, icon: 'fa-film' },
      { id: 'other', label: 'Other Special', name: 'Other', views: 2, icon: 'fa-ellipsis-h' }
    ];

    const CT_REGIONS = [
      { id: 'brain', label: 'Brain / Head', sublabel: 'Cerebral', name: 'Brain', icon: 'fa-brain' },
      { id: 'tap', label: 'TAP', sublabel: 'Thorax / Abdo / Pelvis', name: 'TAP', icon: 'fa-child-body' },
      { id: 'ctap', label: 'CTAP', sublabel: 'Cerebral + TAP', name: 'CTAP (Cerebral + TAP)', icon: 'fa-head-side-medical' },
      { id: 'gt4', label: 'Multi-Region (>4)', sublabel: '>4 Regions', name: '>4 regions', icon: 'fa-layer-group' },
      { id: 'other', label: 'Other Custom Scan', sublabel: 'Custom', name: 'Other', icon: 'fa-sliders' }
    ];

    const QUICK_BOTTLENECKS = ['IV Line Delay', 'Patient Late', 'Transport Delay', 'Sanitation Delay', 'Consent Delay', 'Console Queue'];

    function triggerHaptic(duration = 35) {
      if (typeof window !== 'undefined' && 'navigator' in window && window.navigator.vibrate) {
        try { window.navigator.vibrate(duration); } catch (e) {}
      }
    }

    function getAutoDetectedShift(dateObj = new Date()) {
      const totalMin = dateObj.getHours() * 60 + dateObj.getMinutes();
      if (totalMin >= 450 && totalMin < 720) {
        return 'Morning (7:30 AM - 12:00 PM)';
      } else if (totalMin >= 720 && totalMin < 1140) {
        return 'Afternoon (12:00 PM - 7:00 PM)';
      } else {
        return 'Overnight (7:00 PM - 7:30 AM)';
      }
    }

    function getOrCreateDeviceId() {
      try {
        let id = localStorage.getItem('radiology_station_id');
        if (!id) {
          const rand = Math.floor(1000 + Math.random() * 9000);
          id = `STATION-RAD-${rand}`;
          localStorage.setItem('radiology_station_id', id);
        }
        return id;
      } catch (e) {
        return 'STATION-RAD-01';
      }
    }

    function formatDuration(totalSeconds) {
      if (!totalSeconds || isNaN(totalSeconds) || totalSeconds < 0) return '00:00';
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = Math.floor(totalSeconds % 60);
      if (hrs > 0) {
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function formatDateTimeLocal(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleString('en-US', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
      } catch (e) {
        return isoStr;
      }
    }

    function formatTimeOnly(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleTimeString('en-US', {
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
      } catch (e) {
        return isoStr;
      }
    }

    function getStepDuration(step, nowTs) {
      if (!step) return 0;
      if (step.status === 'completed') {
        return step.durationSeconds || 0;
      }
      const accumulated = step.accumulatedSeconds || 0;
      if (step.status === 'in_progress' && step.activeSegmentStart) {
        const live = Math.max(0, Math.floor((nowTs - step.activeSegmentStart) / 1000));
        return accumulated + live;
      }
      return accumulated;
    }

    function flattenRecordForSheet(obs) {
      const handsOnSec = obs.summaryMetrics?.handsOnDurationSec || 0;
      const postSec = obs.summaryMetrics?.postProcessingDurationSec || 0;
      const totalSec = obs.summaryMetrics?.totalDurationSec || (handsOnSec + postSec);

      const pauseCount = obs.multiPatientPauseCount || 0;
      const isInterrupted = pauseCount > 0;

      const microTimings = (obs.stepLogs || []).map((step, idx) => {
        const sStart = step.startTime ? formatTimeOnly(step.startTime) : '';
        const sEnd = step.endTime ? formatTimeOnly(step.endTime) : '';
        const timeSpan = (sStart && sEnd) ? ` (${sStart}-${sEnd})` : '';
        const pauseNote = step.isMultiPatientInterrupted
          ? ` [PAUSED ${step.pauseEvents?.length || 1}x for concurrent patient | Active work: ${step.durationSeconds || 0}s]`
          : '';
        return `Step ${idx + 1} [${step.stepName}]: ${step.durationSeconds || 0}s active${timeSpan}${pauseNote}`;
      }).join(' | ');

      const timestampLogged = obs.timestampLogged ? formatDateTimeLocal(obs.timestampLogged) : formatDateTimeLocal(new Date().toISOString());
      const overallStartFormatted = obs.overallStartTime ? formatDateTimeLocal(obs.overallStartTime) : formatDateTimeLocal(new Date().toISOString());
      const overallEndFormatted = obs.overallEndTime ? formatDateTimeLocal(obs.overallEndTime) : formatDateTimeLocal(new Date().toISOString());

      const stationVal = obs.stationId || obs.observerName || 'STATION-RAD-01';
      const observerVal = obs.observerName || obs.stationId || 'STATION-RAD-01';
      const patientVal = obs.patientId || ('ACC-' + Math.floor(100000 + Math.random() * 900000));
      const shiftVal = obs.shift || getAutoDetectedShift();
      const modalityVal = obs.modality || 'CT';
      const contrastVal = obs.hasContrast ? 'Yes' : 'No';
      const patientTypeVal = obs.patientType || 'OPD';
      const bodyPartVal = obs.bodyPart || (modalityVal === 'CT' ? 'Brain' : 'Chest (1 view)');
      const templateVal = obs.templateName || (WORKFLOW_TEMPLATES[obs.templateKey]?.name || (modalityVal === 'CT' ? 'CT Scan' : 'X-Ray'));
      const filmSizeVal = obs.resources?.filmSize || '14x17';
      const filmsPrintedVal = obs.resources?.filmsPrinted ?? 0;
      const techCountVal = obs.resources?.techCount ?? 1;
      const nurseCountVal = obs.resources?.nurseCount ?? 0;

      let bottleneckVal = obs.resources?.bottleneckNotes || '';
      if (isInterrupted) {
        const multiNote = `[CONCURRENT MULTI-PATIENT WORKFLOW: Step paused ${pauseCount} time(s) to attend other patients. Steps affected: ${obs.multiPatientPauseSummary || 'Multiple'}. Active duration is exact - NOT a slow step]`;
        bottleneckVal = bottleneckVal ? `${multiNote} | Field Notes: ${bottleneckVal}` : multiNote;
      } else if (!bottleneckVal) {
        bottleneckVal = 'None';
      }

      return {
        ...obs,
        timestampLogged,
        microStepTimings: microTimings,

        "Timestamp Logged": timestampLogged,
        "Observation ID": obs.id || '',
        "Station ID": stationVal,
        "Observer Name": observerVal,
        "Patient ID": patientVal,
        "Shift": shiftVal,
        "Modality": modalityVal,
        "IV Contrast": contrastVal,
        "Patient Type": patientTypeVal,
        "Body Region / Exam": bodyPartVal,
        "Workflow Template": templateVal,
        "Overall Start Time": overallStartFormatted,
        "Overall End Time": overallEndFormatted,
        "Total Sec": totalSec,
        "Hands-On Sec": handsOnSec,
        "Post-Proc Sec": postSec,
        "Total (mm:ss)": formatDuration(totalSec),
        "Hands-On (mm:ss)": formatDuration(handsOnSec),
        "Post-Proc (mm:ss)": formatDuration(postSec),
        "Films Printed": filmsPrintedVal,
        "Film Size": filmSizeVal,
        "Tech Count": techCountVal,
        "Nurse Count": nurseCountVal,
        "Multi-Patient Interrupted": isInterrupted ? `YES (${pauseCount} pause${pauseCount > 1 ? 's' : ''})` : 'NO',
        "Is Real Delay Or Multi-Patient": isInterrupted ? 'Multi-Patient Concurrency (NOT a slow step)' : 'Normal Flow',
        "Interruption Details": obs.multiPatientPauseSummary || 'None',
        "Bottlenecks / Notes": bottleneckVal,
        "Micro Step Timings": microTimings
      };
    }

    function QrScannerModal({ isOpen, onClose, onScanSuccess }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [scanError, setScanError] = useState('');
      const [manualCode, setManualCode] = useState('');

      useEffect(() => {
        let stream = null;
        let animId = null;
        let isMounted = true;

        if (isOpen) {
          setScanError('');
          setManualCode('');

          const constraints = {
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          };

          if (navigator.mediaDevices?.getUserMedia) {
            navigator.mediaDevices.getUserMedia(constraints)
              .then((s) => {
                if (!isMounted) {
                  s.getTracks().forEach(t => t.stop());
                  return;
                }
                stream = s;
                if (videoRef.current) {
                  videoRef.current.srcObject = stream;
                  videoRef.current.setAttribute('playsinline', 'true');
                  videoRef.current.play().then(() => {
                    if (isMounted) animId = requestAnimationFrame(tick);
                  }).catch(err => {
                    if (isMounted) setScanError('Unable to start camera preview. Please use manual entry below.');
                  });
                }
              })
              .catch((err) => {
                if (isMounted) setScanError('Camera permission denied or unavailable. Please enter code manually.');
              });
          } else {
            setScanError('Camera not supported on this browser. Use manual entry.');
          }
        }

        function tick() {
          if (!isMounted) return;
          if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
            const video = videoRef.current;
            const canvas = canvasRef.current;
            if (canvas) {
              const width = video.videoWidth;
              const height = video.videoHeight;
              if (width > 0 && height > 0) {
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (ctx) {
                  ctx.drawImage(video, 0, 0, width, height);
                  try {
                    const imageData = ctx.getImageData(0, 0, width, height);
                    if (window.jsQR) {
                      const code = window.jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: 'attemptBoth',
                      });
                      if (code && code.data) {
                        triggerHaptic(60);
                        onScanSuccess(code.data.trim());
                        stopStream();
                        return;
                      }
                    }
                  } catch (e) {}
                }
              }
            }
          }
          if (isMounted) animId = requestAnimationFrame(tick);
        }

        function stopStream() {
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
          if (animId) {
            cancelAnimationFrame(animId);
          }
        }

        return () => {
          isMounted = false;
          stopStream();
        };
      }, [isOpen, onScanSuccess]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4 text-center border border-slate-200">
            <div className="flex items-center justify-between border-b pb-3">
              <h3 className="font-extrabold text-sm text-slate-900 flex items-center space-x-2">
                <i className="fa-solid fa-qrcode text-sky-600"></i>
                <span>Scan Barcode / QR Code</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="relative rounded-2xl overflow-hidden bg-slate-900 aspect-video sm:aspect-square flex items-center justify-center border-2 border-sky-500/50 shadow-inner">
              <video ref={videoRef} className="w-full h-full object-cover"></video>
              <canvas ref={canvasRef} className="hidden"></canvas>

              <div className="absolute inset-8 border-2 border-dashed border-sky-400/80 rounded-2xl pointer-events-none flex items-center justify-center">
                <div className="w-full h-0.5 bg-rose-500/80 animate-pulse"></div>
              </div>

              {scanError && (
                <div className="absolute inset-0 bg-slate-950/95 p-6 flex flex-col items-center justify-center text-center">
                  <i className="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-2"></i>
                  <p className="text-xs text-white font-medium">{scanError}</p>
                </div>
              )}
            </div>

            <div className="space-y-2">
              <p className="text-[11px] text-slate-500">
                Center QR code within viewfinder or enter accession ID directly below:
              </p>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={manualCode}
                  onChange={(e) => setManualCode(e.target.value)}
                  placeholder="Enter accession code..."
                  className="flex-1 px-3 py-2 text-xs font-mono border rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500"
                />
                <button
                  onClick={() => {
                    if (manualCode.trim()) {
                      triggerHaptic(40);
                      onScanSuccess(manualCode.trim());
                    }
                  }}
                  className="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-xl shadow-sm cursor-pointer"
                >
                  Apply
                </button>
              </div>
            </div>

            <button
              onClick={onClose}
              className="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl transition cursor-pointer"
            >
              Close Scanner
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('setup');
      const [stationId, setStationId] = useState(getOrCreateDeviceId());
      const [isStationLocked, setIsStationLocked] = useState(true);
      const [sheetsUrl, setSheetsUrl] = useState(() => {
        try { return localStorage.getItem('radiology_sheets_url') || HARDCODED_SHEETS_URL; }
        catch (e) { return HARDCODED_SHEETS_URL; }
      });
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showScannerModal, setShowScannerModal] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [slideAnimClass, setSlideAnimClass] = useState('animate-slide-in-right');

      const [formData, setFormData] = useState({
        observerName: stationId,
        patientId: '',
        modality: 'XRay',
        hasContrast: 'no',
        bodyPart: 'Chest (1 view)',
        customBodyPart: '',
        xrayViews: 1,
        patientType: 'OPD',
        shift: getAutoDetectedShift(),
        isShiftOverridden: false
      });

      const [activeSessions, setActiveSessions] = useState(() => {
        try {
          const saved = localStorage.getItem('radiology_active_sessions_v1');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });

      const [currentSessionId, setCurrentSessionId] = useState(null);

      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('radiology_history_v2');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });

      const [now, setNow] = useState(Date.now());
      const [toast, setToast] = useState({ show: false, message: '' });

      useEffect(() => {
        try {
          localStorage.setItem('radiology_active_sessions_v1', JSON.stringify(activeSessions));
        } catch (e) {}
      }, [activeSessions]);

      useEffect(() => {
        try {
          localStorage.setItem('radiology_history_v2', JSON.stringify(history));
        } catch (e) {}
      }, [history]);

      useEffect(() => {
        let interval = null;
        if (view === 'tracking') {
          interval = setInterval(() => setNow(Date.now()), 1000);
        }
        return () => { if (interval) clearInterval(interval); };
      }, [view]);

      const showToast = (message) => {
        setToast({ show: true, message });
        setTimeout(() => setToast({ show: false, message: '' }), 3200);
      };

      const getTemplateKey = (modality, hasContrast) => {
        if (modality === 'CT') {
          return hasContrast === 'yes' ? 'CT_WITH_CONTRAST' : 'CT_NO_CONTRAST';
        } else {
          return hasContrast === 'yes' ? 'XRAY_WITH_CONTRAST' : 'XRAY_NO_CONTRAST';
        }
      };

      const trackingSession = activeSessions.find(s => s.id === currentSessionId) || null;

      const matchingActiveSession = formData.patientId.trim()
        ? activeSessions.find(s => s.patientId.toLowerCase() === formData.patientId.trim().toLowerCase())
        : null;

      const sendToGoogleSheets = async (recordsToSync) => {
        if (!sheetsUrl || !recordsToSync || recordsToSync.length === 0) return false;
        setIsSyncing(true);
        try {
          const flattened = recordsToSync.map(r => flattenRecordForSheet(r));
          await fetch(sheetsUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(flattened)
          });
          setLastSyncTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
          setIsSyncing(false);
          return true;
        } catch (err) {
          setIsSyncing(false);
          return false;
        }
      };

      const logMultiPatientPauseToSheets = async (pausedSession, pausedStepName, pausedStepIndex, targetPatientId, activeSecSoFar) => {
        if (!sheetsUrl) return;

        const pauseRecord = {
          "Timestamp Logged": formatDateTimeLocal(new Date().toISOString()),
          "Observation ID": pausedSession.id || '',
          "Station ID": pausedSession.stationId || '',
          "Observer Name": pausedSession.observerName || '',
          "Patient ID": pausedSession.patientId,
          "Shift": pausedSession.shift,
          "Modality": pausedSession.modality,
          "IV Contrast": pausedSession.hasContrast ? 'Yes' : 'No',
          "Patient Type": pausedSession.patientType || 'OPD',
          "Body Region / Exam": pausedSession.bodyPart,
          "Workflow Template": pausedSession.templateName,
          "Overall Start Time": formatDateTimeLocal(pausedSession.overallStartTime),
          "Overall End Time": "IN_PROGRESS (PAUSED FOR OTHER PATIENT)",
          "Total Sec": activeSecSoFar,
          "Total (mm:ss)": formatDuration(activeSecSoFar),
          "Record Type": "CONCURRENT_MULTI_PATIENT_PAUSE_EVENT",
          "Is Real Delay Or Multi-Patient": "Multi-Patient Concurrency (NOT a slow step)",
          "Multi-Patient Interrupted": "YES (Paused for Concurrent Patient)",
          "Paused Step Index": pausedStepIndex,
          "Paused Step Name": pausedStepName,
          "Interrupted For Patient": targetPatientId || "New Patient",
          "Interruption Details": `Step ${pausedStepIndex} (${pausedStepName}) paused at ${formatTimeOnly(new Date().toISOString())} to attend to Patient ${targetPatientId || 'New Patient'}. Active working time: ${activeSecSoFar}s.`,
          "Bottlenecks / Notes": `[CONCURRENT MULTI-PATIENT PAUSE] Step ${pausedStepIndex} (${pausedStepName}) was paused to care for Patient ${targetPatientId || 'New Patient'}. Active working time before pause: ${formatDuration(activeSecSoFar)}. This is NOT a slow step.`,
          "Micro Step Timings": `Step ${pausedStepIndex} [${pausedStepName}]: PAUSED at ${formatTimeOnly(new Date().toISOString())} for Patient ${targetPatientId || 'New Patient'} (Active: ${activeSecSoFar}s)`
        };

        try {
          await fetch(sheetsUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([pauseRecord])
          });
          setLastSyncTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        } catch (err) {}
      };

      const pauseSessionTimer = (sessionObj, targetPatientId = 'Another Patient') => {
        const nowTs = Date.now();
        const nowIso = new Date(nowTs).toISOString();
        let stepNamePaused = '';
        let stepIndexPaused = 1;
        let activeSecAtPause = 0;

        const updatedLogs = sessionObj.stepLogs.map((log, idx) => {
          if (idx === sessionObj.currentStepIndex && log.status === 'in_progress' && log.activeSegmentStart) {
            const addedSec = Math.max(0, Math.floor((nowTs - log.activeSegmentStart) / 1000));
            const totalActiveSec = (log.accumulatedSeconds || 0) + addedSec;
            stepNamePaused = log.stepName;
            stepIndexPaused = idx + 1;
            activeSecAtPause = totalActiveSec;

            const newPauseEvent = {
              pausedAt: nowIso,
              targetPatientId: targetPatientId,
              activeSecondsBeforePause: totalActiveSec
            };

            return {
              ...log,
              accumulatedSeconds: totalActiveSec,
              activeSegmentStart: null,
              isMultiPatientInterrupted: true,
              pauseEvents: [...(log.pauseEvents || []), newPauseEvent]
            };
          }
          return log;
        });

        const newPauseCount = (sessionObj.multiPatientPauseCount || 0) + 1;
        const pauseNote = `Step ${stepIndexPaused} (${stepNamePaused || 'Active Step'}) paused for Patient ${targetPatientId} at ${formatTimeOnly(nowIso)}`;
        const newSummary = sessionObj.multiPatientPauseSummary
          ? `${sessionObj.multiPatientPauseSummary}; ${pauseNote}`
          : pauseNote;

        const updatedSession = {
          ...sessionObj,
          stepLogs: updatedLogs,
          multiPatientPauseCount: newPauseCount,
          multiPatientPauseSummary: newSummary
        };

        if (stepNamePaused) {
          logMultiPatientPauseToSheets(sessionObj, stepNamePaused, stepIndexPaused, targetPatientId, activeSecAtPause);
        }

        return updatedSession;
      };

      const resumeSessionTimer = (sessionObj) => {
        const nowTs = Date.now();
        const nowIso = new Date(nowTs).toISOString();
        const updatedLogs = sessionObj.stepLogs.map((log, idx) => {
          if (idx === sessionObj.currentStepIndex) {
            const pauseEvents = log.pauseEvents ? [...log.pauseEvents] : [];
            if (pauseEvents.length > 0 && !pauseEvents[pauseEvents.length - 1].resumedAt) {
              pauseEvents[pauseEvents.length - 1] = {
                ...pauseEvents[pauseEvents.length - 1],
                resumedAt: nowIso
              };
            }
            return {
              ...log,
              status: 'in_progress',
              activeSegmentStart: nowTs,
              pauseEvents
            };
          }
          return log;
        });
        return { ...sessionObj, stepLogs: updatedLogs };
      };

      const handleResumeExistingSession = (sessionIdToResume) => {
        triggerHaptic(40);
        const targetPatient = activeSessions.find(s => s.id === sessionIdToResume);
        const targetPatientCode = targetPatient ? targetPatient.patientId : 'Concurrent Patient';

        let updatedList = activeSessions.map(s => {
          if (s.id === currentSessionId && s.id !== sessionIdToResume) {
            return pauseSessionTimer(s, targetPatientCode);
          }
          return s;
        });

        updatedList = updatedList.map(s => {
          if (s.id === sessionIdToResume) {
            return resumeSessionTimer(s);
          }
          return s;
        });

        setActiveSessions(updatedList);
        setCurrentSessionId(sessionIdToResume);
        setSlideAnimClass('animate-slide-in-right');
        setView('tracking');

        if (targetPatient) {
          showToast(`Resumed active study for Patient: ${targetPatient.patientId}`);
        }
      };

      const handleStartObservation = (e) => {
        if (e) e.preventDefault();
        triggerHaptic(50);

        const effectiveObserver = formData.observerName.trim() || stationId.trim() || getOrCreateDeviceId();
        const reqPatientId = formData.patientId.trim();

        try {
          localStorage.setItem('radiology_station_id', effectiveObserver);
          setStationId(effectiveObserver);
        } catch (err) {}

        if (reqPatientId) {
          const existing = activeSessions.find(s => s.patientId.toLowerCase() === reqPatientId.toLowerCase());
          if (existing) {
            handleResumeExistingSession(existing.id);
            return;
          }
        }

        const newPatientCode = reqPatientId || ('ACC-' + Math.floor(100000 + Math.random() * 900000));

        let currentActiveList = activeSessions;
        if (currentSessionId) {
          currentActiveList = activeSessions.map(s => {
            if (s.id === currentSessionId) return pauseSessionTimer(s, newPatientCode);
            return s;
          });
        }

        const templateKey = getTemplateKey(formData.modality, formData.hasContrast);
        const template = WORKFLOW_TEMPLATES[templateKey];
        const startTimeIso = new Date().toISOString();
        const nowTs = Date.now();

        const initialLogs = template.steps.map((step, idx) => ({
          stepId: step.id,
          stepName: step.name,
          stepType: step.type,
          icon: step.icon,
          status: idx === 0 ? 'in_progress' : 'pending',
          startTime: idx === 0 ? startTimeIso : null,
          endTime: null,
          accumulatedSeconds: 0,
          activeSegmentStart: idx === 0 ? nowTs : null,
          durationSeconds: 0,
          note: ''
        }));

        const finalBodyPart = formData.bodyPart === 'Other' && formData.customBodyPart.trim()
          ? `Other: ${formData.customBodyPart.trim()}`
          : formData.bodyPart;

        const initialFilmCount = formData.modality === 'XRay'
          ? (Number(formData.xrayViews) || 1)
          : 2;

        const newSession = {
          id: 'OBS-' + Date.now().toString().slice(-6),
          observerName: effectiveObserver,
          stationId: effectiveObserver,
          patientId: newPatientCode,
          modality: formData.modality,
          hasContrast: formData.hasContrast === 'yes',
          patientType: formData.patientType || 'OPD',
          bodyPart: finalBodyPart,
          xrayViews: formData.modality === 'XRay' ? formData.xrayViews : null,
          shift: formData.shift || getAutoDetectedShift(),
          templateKey: templateKey,
          templateName: template.name,
          overallStartTime: startTimeIso,
          overallEndTime: null,
          currentStepIndex: 0,
          stepLogs: initialLogs,
          syncedToSheet: false,
          resources: {
            filmsPrinted: initialFilmCount,
            filmSize: '14x17',
            techCount: 1,
            nurseCount: formData.hasContrast === 'yes' ? 1 : 0,
            bottleneckNotes: ''
          }
        };

        setActiveSessions([newSession, ...currentActiveList]);
        setCurrentSessionId(newSession.id);
        setSlideAnimClass('animate-slide-in-right');
        setView('tracking');
        showToast(`Observation launched for Patient ${newSession.patientId}!`);
      };

      const handleTapStepComplete = () => {
        triggerHaptic(40);
        if (!trackingSession) return;

        setSlideAnimClass('animate-slide-out-left');

        setTimeout(() => {
          const nowTs = Date.now();
          const nowIso = new Date(nowTs).toISOString();
          const logs = [...trackingSession.stepLogs];
          const currentIndex = trackingSession.currentStepIndex;
          const currentStep = logs[currentIndex];

          const totalStepSec = getStepDuration(currentStep, nowTs);

          logs[currentIndex] = {
            ...currentStep,
            status: 'completed',
            endTime: nowIso,
            durationSeconds: Math.max(1, totalStepSec),
            activeSegmentStart: null,
            accumulatedSeconds: Math.max(1, totalStepSec)
          };

          let updatedSession;

          if (currentIndex + 1 < logs.length) {
            logs[currentIndex + 1] = {
              ...logs[currentIndex + 1],
              status: 'in_progress',
              startTime: logs[currentIndex + 1].startTime || nowIso,
              activeSegmentStart: nowTs,
              accumulatedSeconds: logs[currentIndex + 1].accumulatedSeconds || 0
            };

            updatedSession = {
              ...trackingSession,
              currentStepIndex: currentIndex + 1,
              stepLogs: logs
            };

            setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updatedSession : s));
            setSlideAnimClass('animate-slide-in-right');
          } else {
            updatedSession = {
              ...trackingSession,
              overallEndTime: nowIso,
              stepLogs: logs
            };
            setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updatedSession : s));
            setView('resources');
            showToast('All steps completed! Log study consumables.');
          }
        }, 200);
      };

      const handleUndoLastStep = () => {
        triggerHaptic(30);
        if (!trackingSession || trackingSession.currentStepIndex === 0) return;

        setSlideAnimClass('animate-slide-in-right');
        const nowTs = Date.now();
        const logs = [...trackingSession.stepLogs];
        const currentIndex = trackingSession.currentStepIndex;

        logs[currentIndex] = {
          ...logs[currentIndex],
          status: 'pending',
          activeSegmentStart: null,
          endTime: null
        };

        const prevIndex = currentIndex - 1;
        logs[prevIndex] = {
          ...logs[prevIndex],
          status: 'in_progress',
          activeSegmentStart: nowTs,
          endTime: null
        };

        const updatedSession = {
          ...trackingSession,
          currentStepIndex: prevIndex,
          stepLogs: logs
        };

        setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updatedSession : s));
      };

      const handleNewPatientFromStopwatch = () => {
        triggerHaptic(35);
        if (currentSessionId) {
          const updated = activeSessions.map(s => {
            if (s.id === currentSessionId) return pauseSessionTimer(s, 'New Patient Intake');
            return s;
          });
          setActiveSessions(updated);
        }

        setFormData(prev => ({
          ...prev,
          patientId: '',
          shift: getAutoDetectedShift()
        }));

        setView('setup');
        showToast("Current tracking paused & logged to Sheets. Scan or enter new patient!");
      };

      const handleToggleBottleneck = (tag) => {
        triggerHaptic(20);
        if (!trackingSession) return;

        const currentNotes = trackingSession.resources.bottleneckNotes || '';
        let updatedNotes = '';

        if (currentNotes.includes(tag)) {
          updatedNotes = currentNotes.replace(tag, '').replace(/,\s*,/g, ',').replace(/^,\s*|\s*,\s*$/g, '');
        } else {
          updatedNotes = currentNotes ? `${currentNotes}, ${tag}` : tag;
        }

        const updatedSession = {
          ...trackingSession,
          resources: {
            ...trackingSession.resources,
            bottleneckNotes: updatedNotes
          }
        };

        setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updatedSession : s));
      };

      const handleSaveResources = async (e) => {
        if (e) e.preventDefault();
        triggerHaptic(50);
        if (!trackingSession) return;

        let handsOnSec = 0;
        let postSec = 0;
        const endTimeIso = trackingSession.overallEndTime || new Date().toISOString();

        trackingSession.stepLogs.forEach(log => {
          const sec = log.durationSeconds || 0;
          if (log.stepType === 'hands_on') {
            handsOnSec += sec;
          } else {
            postSec += sec;
          }
        });

        const totalSec = handsOnSec + postSec;

        const baseRecord = {
          ...trackingSession,
          overallEndTime: endTimeIso,
          timestampLogged: new Date().toISOString(),
          syncedToSheet: false,
          summaryMetrics: {
            handsOnDurationSec: handsOnSec,
            postProcessingDurationSec: postSec,
            totalDurationSec: totalSec
          }
        };

        const finalRecord = flattenRecordForSheet(baseRecord);

        let isSynced = false;
        if (sheetsUrl) {
          isSynced = await sendToGoogleSheets([finalRecord]);
        }

        finalRecord.syncedToSheet = isSynced;

        const updatedActiveList = activeSessions.filter(s => s.id !== trackingSession.id);
        setActiveSessions(updatedActiveList);
        setHistory([finalRecord, ...history]);

        if (updatedActiveList.length > 0) {
          setCurrentSessionId(updatedActiveList[0].id);
        } else {
          setCurrentSessionId(null);
        }

        setFormData(prev => ({ ...prev, patientId: '' }));
        setView('summary');
        showToast(isSynced ? "Saved & Live Synced to Google Sheets!" : "Saved locally (Offline mode).");
      };

      const handleStartNewPatient = () => {
        triggerHaptic(30);
        setFormData({
          ...formData,
          patientId: '',
          shift: getAutoDetectedShift()
        });
        setView('setup');
      };

      const handleManualSyncAll = async () => {
        triggerHaptic(40);
        const unsynced = history.filter(item => !item.syncedToSheet);
        if (unsynced.length === 0) {
          showToast("All completed observations are already synced to Sheets!");
          return;
        }

        const success = await sendToGoogleSheets(unsynced);
        if (success) {
          const updated = history.map(item => ({ ...item, syncedToSheet: true }));
          setHistory(updated);
          showToast(`Successfully synced ${unsynced.length} records to Google Sheets!`);
        } else {
          showToast("Sync failed. Check connection or Apps Script URL.");
        }
      };

      const handleExportCSV = () => {
        triggerHaptic(30);
        if (history.length === 0) {
          showToast("No recorded study data to export.");
          return;
        }

        const headers = Object.keys(history[0]).filter(k => typeof history[0][k] !== 'object');
        const csvRows = [
          headers.join(','),
          ...history.map(row => headers.map(h => JSON.stringify(row[h] || '')).join(','))
        ];

        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `Radiology_Time_Study_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast("CSV backup file exported!");
      };

      return (
        <div className="max-w-md sm:max-w-xl mx-auto px-4 py-3 min-h-screen flex flex-col justify-between">

          {/* Header Bar */}
          <header className="bg-white/80 backdrop-blur-md border border-slate-200/80 rounded-2xl p-3 shadow-sm mb-3 flex items-center justify-between">
            <div className="flex items-center space-x-2.5">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 to-sky-500 text-white flex items-center justify-center font-black text-lg shadow-md">
                <i className="fa-solid fa-microscope"></i>
              </div>
              <div>
                <h1 className="text-xs font-black text-slate-900 tracking-tight flex items-center gap-1.5">
                  <span>RAD TIME & MOTION</span>
                  <span className="bg-sky-100 text-sky-800 text-[9px] px-1.5 py-0.5 rounded font-extrabold uppercase">CT & X-Ray</span>
                </h1>
                <p className="text-[10px] text-slate-500 font-semibold">Workflow Efficiency Tracker</p>
              </div>
            </div>

            <div className="flex items-center space-x-1.5">
              <button
                onClick={() => { triggerHaptic(20); setShowSettingsModal(true); }}
                className={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 cursor-pointer ${
                  isSyncing ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                }`}
                title="Google Sheets Configuration"
              >
                <i className={`fa-solid ${isSyncing ? 'fa-spinner fa-spin text-amber-600' : 'fa-cloud text-sky-600'}`}></i>
                <span className="text-[11px] font-extrabold">
                  {lastSyncTime ? `Synced ${lastSyncTime}` : 'Sheets'}
                </span>
              </button>
            </div>
          </header>

          {/* In-Progress Patients Banner Strip */}
          {activeSessions.length > 0 && (
            <div className="mb-3 bg-white/90 backdrop-blur-md rounded-2xl p-2.5 border border-sky-200 shadow-sm">
              <div className="flex items-center justify-between mb-1.5 px-1">
                <span className="text-[11px] font-black text-sky-950 uppercase tracking-wider flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  In-Progress Patients ({activeSessions.length})
                </span>
                {view !== 'setup' && (
                  <button
                    onClick={handleNewPatientFromStopwatch}
                    className="text-[10px] font-extrabold text-sky-700 hover:underline flex items-center gap-1 cursor-pointer"
                  >
                    <i className="fa-solid fa-user-plus"></i>
                    <span>+ Add Patient</span>
                  </button>
                )}
              </div>
              <div className="flex gap-2 overflow-x-auto no-scrollbar pb-0.5">
                {activeSessions.map(session => {
                  const isSelected = session.id === currentSessionId && view === 'tracking';
                  const currentStep = session.stepLogs[session.currentStepIndex];
                  const isPausedForOther = currentStep?.isMultiPatientInterrupted;
                  return (
                    <button
                      key={session.id}
                      onClick={() => handleResumeExistingSession(session.id)}
                      className={`px-3 py-2 rounded-xl text-left border flex-shrink-0 transition active:scale-95 flex items-center space-x-2 cursor-pointer ${
                        isSelected
                          ? 'bg-sky-600 text-white border-sky-600 shadow-md ring-2 ring-sky-400/30'
                          : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200'
                      }`}
                    >
                      <div className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold ${
                        isSelected ? 'bg-white/20 text-white' : 'bg-sky-100 text-sky-800'
                      }`}>
                        <i className={`fa-solid ${session.modality === 'CT' ? 'fa-ring' : 'fa-x-ray'}`}></i>
                      </div>
                      <div>
                        <div className="text-xs font-mono font-extrabold leading-tight flex items-center gap-1">
                          <span>{session.patientId}</span>
                          {isPausedForOther && (
                            <span className="w-1.5 h-1.5 rounded-full bg-amber-400" title="Step paused for concurrent patient"></span>
                          )}
                        </div>
                        <div className={`text-[9px] font-semibold ${isSelected ? 'text-sky-100' : 'text-slate-500'}`}>
                          Step {session.currentStepIndex + 1}/{session.stepLogs.length}: {currentStep?.stepName.slice(0, 15)}...
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast.show && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-2 border border-slate-700 animate-bounce">
              <i className="fa-solid fa-circle-info text-sky-400"></i>
              <span>{toast.message}</span>
            </div>
          )}

          {/* QR Code Scanner Modal */}
          <QrScannerModal
            isOpen={showScannerModal}
            onClose={() => setShowScannerModal(false)}
            onScanSuccess={(scannedText) => {
              const trimmed = scannedText.trim();
              setFormData(prev => ({ ...prev, patientId: trimmed }));
              setShowScannerModal(false);

              const existing = activeSessions.find(s => s.patientId.toLowerCase() === trimmed.toLowerCase());
              if (existing) {
                triggerHaptic(80);
                showToast(`Scanned Patient ID ${trimmed} already exists! Resuming session...`);
                handleResumeExistingSession(existing.id);
              } else {
                showToast(`Scanned Patient ID: ${trimmed}`);
              }
            }}
          />

          {/* Google Sheets Settings Modal */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-4 border border-slate-100">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-sm text-slate-900 flex items-center space-x-2">
                    <i className="fa-solid fa-table text-emerald-600"></i>
                    <span>Google Sheets Integration</span>
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <p className="text-xs text-slate-500 leading-relaxed">
                  Observation data and multi-patient pause events are automatically synced to Google Sheets in real-time.
                </p>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Apps Script Endpoint URL</label>
                  <input
                    type="url"
                    value={sheetsUrl}
                    onChange={(e) => setSheetsUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full text-xs font-mono p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 outline-none"
                  />
                </div>

                <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2">
                  <div className="flex items-center justify-between text-xs font-medium text-slate-600">
                    <span>Completed Studies Recorded:</span>
                    <span className="font-mono font-bold text-slate-900">{history.length}</span>
                  </div>
                  <div className="flex items-center justify-between text-xs font-medium text-slate-600">
                    <span>Pending Sync:</span>
                    <span className="font-mono font-bold text-amber-600">
                      {history.filter(h => !h.syncedToSheet).length}
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <button
                      type="button"
                      onClick={handleManualSyncAll}
                      className="py-2 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl transition flex items-center justify-center space-x-1 cursor-pointer"
                    >
                      <i className="fa-solid fa-cloud-arrow-up"></i>

                        triggerHaptic(25);
                        const current = trackingSession.resources.filmsPrinted || 0;
                        const updated = { ...trackingSession, resources: { ...trackingSession.resources, filmsPrinted: Math.max(0, current - 1) } };
                        setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                      }}
                      className="w-14 h-14 bg-white border-2 border-slate-200 hover:border-sky-500 rounded-2xl text-xl font-black text-slate-700 shadow-sm active:scale-90 transition flex items-center justify-center cursor-pointer"
                    >
                      <i className="fa-solid fa-minus"></i>
                    </button>

                    <div className="flex-1 text-center bg-white py-3 rounded-2xl border border-slate-200 shadow-inner">
                      <span className="text-2xl font-mono font-black text-sky-600">
                        {trackingSession.resources.filmsPrinted}
                      </span>
                      <span className="block text-[10px] uppercase font-bold text-slate-400">Sheets</span>
                    </div>

                    <button
                      type="button"
                      onClick={() => {
                        triggerHaptic(25);
                        const current = trackingSession.resources.filmsPrinted || 0;
                        const updated = { ...trackingSession, resources: { ...trackingSession.resources, filmsPrinted: current + 1 } };
                        setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                      }}
                      className="w-14 h-14 bg-white border-2 border-slate-200 hover:border-sky-500 rounded-2xl text-xl font-black text-slate-700 shadow-sm active:scale-90 transition flex items-center justify-center cursor-pointer"
                    >
                      <i className="fa-solid fa-plus"></i>
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Film Size Format</label>
                  <div className="grid grid-cols-2 gap-2">
                    {['14x17', '10x12', '8x10', 'Digital-Only'].map((sz) => (
                      <button
                        key={sz}
                        type="button"
                        onClick={() => {
                          triggerHaptic(20);
                          const updated = { ...trackingSession, resources: { ...trackingSession.resources, filmSize: sz } };
                          setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                        }}
                        className={`py-3 px-3 rounded-xl text-xs font-bold border transition cursor-pointer ${
                          trackingSession.resources.filmSize === sz
                            ? 'bg-sky-600 text-white border-sky-600 shadow-sm'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        {sz}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/60">
                    <label className="block text-xs font-bold text-slate-700 mb-2">Technologists</label>
                    <div className="flex items-center justify-between gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          triggerHaptic(20);
                          const cur = trackingSession.resources.techCount || 1;
                          const updated = { ...trackingSession, resources: { ...trackingSession.resources, techCount: Math.max(1, cur - 1) } };
                          setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                        }}
                        className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center cursor-pointer"
                      >
                        <i className="fa-solid fa-minus"></i>
                      </button>
                      <span className="text-lg font-mono font-black text-slate-900">{trackingSession.resources.techCount}</span>
                      <button
                        type="button"
                        onClick={() => {
                          triggerHaptic(20);
                          const cur = trackingSession.resources.techCount || 1;
                          const updated = { ...trackingSession, resources: { ...trackingSession.resources, techCount: cur + 1 } };
                          setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                        }}
                        className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center cursor-pointer"
                      >
                        <i className="fa-solid fa-plus"></i>
                      </button>
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/60">
                    <label className="block text-xs font-bold text-slate-700 mb-2">Nurses / Staff</label>
                    <div className="flex items-center justify-between gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          triggerHaptic(20);
                          const cur = trackingSession.resources.nurseCount || 0;
                          const updated = { ...trackingSession, resources: { ...trackingSession.resources, nurseCount: Math.max(0, cur - 1) } };
                          setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                        }}
                        className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center cursor-pointer"
                      >
                        <i className="fa-solid fa-minus"></i>
                      </button>
                      <span className="text-lg font-mono font-black text-slate-900">{trackingSession.resources.nurseCount}</span>
                      <button
                        type="button"
                        onClick={() => {
                          triggerHaptic(20);
                          const cur = trackingSession.resources.nurseCount || 0;
                          const updated = { ...trackingSession, resources: { ...trackingSession.resources, nurseCount: cur + 1 } };
                          setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                        }}
                        className="w-10 h-10 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 shadow-xs active:scale-90 transition flex items-center justify-center cursor-pointer"
                      >
                        <i className="fa-solid fa-plus"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Notes / Delay Observations</label>
                  <textarea
                    rows={2}
                    value={trackingSession.resources.bottleneckNotes}
                    onChange={(e) => {
                      const updated = { ...trackingSession, resources: { ...trackingSession.resources, bottleneckNotes: e.target.value } };
                      setActiveSessions(activeSessions.map(s => s.id === trackingSession.id ? updated : s));
                    }}
                    placeholder="Note any patient delays, contrast reactions, or scanner recalibrations..."
                    className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white transition"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-sm rounded-2xl shadow-lg active:scale-98 transition flex items-center justify-center space-x-2 cursor-pointer"
                >
                  <i className="fa-solid fa-cloud-arrow-up"></i>
                  <span>SAVE OBSERVATION & SYNC TO SHEETS</span>
                </button>
              </form>
            </div>
          )}

          {/* SUMMARY VIEW */}
          {view === 'summary' && (
            <div className="bg-white/90 backdrop-blur-md rounded-3xl p-6 border border-slate-200/80 shadow-sm my-auto space-y-5 text-center">
              <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto shadow-inner">
                <i className="fa-solid fa-circle-check"></i>
              </div>

              <div>
                <h2 className="text-xl font-black text-slate-900">Study Completed & Logged!</h2>
                <p className="text-xs text-slate-500 font-mono mt-1">Logged to local storage & synced to Sheets</p>
              </div>

              {activeSessions.length > 0 && (
                <div className="p-3 bg-sky-50 border border-sky-200 rounded-2xl text-left">
                  <div className="text-xs font-extrabold text-sky-900 mb-1">
                    <i className="fa-solid fa-users text-sky-600 mr-1.5"></i>
                    Remaining Active Patients ({activeSessions.length}):
                  </div>
                  <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    {activeSessions.map(s => (
                      <button
                        key={s.id}
                        onClick={() => handleResumeExistingSession(s.id)}
                        className="px-3 py-1.5 bg-white border border-sky-300 hover:bg-sky-100 rounded-xl text-xs font-mono font-bold text-sky-950 flex items-center space-x-1 shadow-xs cursor-pointer"
                      >
                        <span>{s.patientId}</span>
                        <i className="fa-solid fa-chevron-right text-[10px]"></i>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <button
                onClick={handleStartNewPatient}
                className="w-full py-4 bg-sky-600 hover:bg-sky-500 text-white font-black text-sm rounded-2xl shadow-lg active:scale-98 transition flex items-center justify-center space-x-2 cursor-pointer"
              >
                <i className="fa-solid fa-plus"></i>
                <span>START NEXT PATIENT OBSERVATION</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
