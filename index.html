<!doctype html>
<html lang="en" class="h-full select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Radiology Time-Motion Study Tracker (CT & X-Ray)</title>
    <meta name="description" content="Workflow efficiency tracker for CT & X-Ray radiology procedures with QR code scanning and Google Sheets synchronization." />
    <meta property="og:title" content="Radiology Time-Motion Study Tracker (CT & X-Ray)" />
    <meta property="og:description" content="Workflow efficiency tracker for CT & X-Ray radiology procedures with QR code scanning and Google Sheets synchronization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- jsQR Library for lightweight pure-JS QR code scanning from video stream -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
        overscroll-behavior-y: none;
      }

      .bg-mesh {
        background-color: #f8fafc;
        background-image:
          radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
          radial-gradient(at 90% 10%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
          radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
      }

      .pulse-subtle {
        animation: pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(0.98); }
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Slide animations for visual cues during step changes */
      @keyframes slideOutLeft {
        0% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(-100%); opacity: 0; }
      }

      @keyframes slideInRight {
        0% { transform: translateX(100%); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }

      .animate-slide-out-left {
        animation: slideOutLeft 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .animate-slide-in-right {
        animation: slideInRight 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-mesh text-slate-800 antialiased min-h-full pb-20 sm:pb-10 selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
