<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radiology Time-Motion Study Tracker (CT & X-Ray)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- jsQR Library for lightweight pure-JS QR code scanning from video stream -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Consolas', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 25px -5px rgba(14, 165, 233, 0.25)',
                        'glow-emerald': '0 0 25px -5px rgba(16, 185, 129, 0.3)',
                        'card': '0 10px 30px -5px rgba(15, 23, 42, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            overscroll-behavior-y: none;
        }
        
        .bg-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 10%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
        }

        .pulse-subtle { 
            animation: pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
        }
        @keyframes pulse { 
            0%, 100% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.85; transform: scale(0.98); } 
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-mesh text-slate-800 antialiased min-h-full pb-20 sm:pb-10 selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">

                ]

            'CT_WITH_CONTRAST': {

                category: 'CT Scan',
                hasContrast: true,
                steps: [
                    { id: 's1', name: 'Patient Intake & Renal Screening', type: 'hands_on', icon: 'fa-vial' },
                    { id: 's2', name: 'IV Cannulation & Injector Setup', type: 'hands_on', icon: 'fa-syringe' },
                    { id: 's3', name: 'Couch Positioning & Scout Setup', type: 'hands_on', icon: 'fa-crosshairs' },
                    { id: 's4', name: 'Contrast Injection & Dynamic Scan', type: 'hands_on', icon: 'fa-heart-pulse' },
                    { id: 's5', name: 'Line Removal & Reaction Watch', type: 'hands_on', icon: 'fa-user-nurse' },
                    { id: 's6', name: 'Advanced 3D Recon (MPR/MIP/VRT)', type: 'post_patient', icon: 'fa-layer-group' },
                    { id: 's7', name: 'Multi-Sheet Printing & Packaging', type: 'post_patient', icon: 'fa-print' },
                    { id: 's8', name: 'Final Handover & Hydration Guidance', type: 'post_patient', icon: 'fa-bottle-water' }
                ]
            }
        };

        const XRAY_REGIONS = [
            { id: 'chest', label: 'Chest (1 view)', name: 'Chest (1 view)', views: 1, icon: 'fa-lungs' },
            { id: 'bones', label: 'Limbs & Spine', name: 'Bones / Limbs / Spines (2 views)', views: 2, icon: 'fa-bone' },
            { id: 'fluoro', label: 'Fluoroscopy', name: 'Fluoroscopy (6 views)', views: 6, icon: 'fa-film' },
            { id: 'other', label: 'Other Special', name: 'Other', views: 2, icon: 'fa-ellipsis-h' }
        ];

        const CT_REGIONS = [
            { id: 'brain', label: 'Brain / Head', sublabel: 'Cerebral', name: 'Brain', icon: 'fa-brain' },
            { id: 'tap', label: 'TAP', sublabel: 'Thorax / Abdo / Pelvis', name: 'TAP', icon: 'fa-child-body' },
            { id: 'ctap', label: 'CTAP', sublabel: 'Cerebral + TAP', name: 'CTAP (Cerebral + TAP)', icon: 'fa-head-side-medical' },
            { id: 'gt4', label: 'Multi-Region (>4)', sublabel: '>4 Regions', name: '>4 regions', icon: 'fa-layer-group' },
            { id: 'other', label: 'Other Custom Scan', sublabel: 'Custom', name: 'Other', icon: 'fa-sliders' }
        ];

        const QUICK_BOTTLENECKS = ['IV Line Delay', 'Patient Late', 'Transport Delay', 'Sanitation Delay', 'Consent Delay', 'Console Queue'];

        function triggerHaptic(duration = 35) {
            if (typeof window !== 'undefined' && 'navigator' in window && window.navigator.vibrate) {
                try { window.navigator.vibrate(duration); } catch(e) {}
            }
        }

        function getAutoDetectedShift(dateObj = new Date()) {
            const totalMin = dateObj.getHours() * 60 + dateObj.getMinutes();
            if (totalMin >= 450 && totalMin < 720) {
                return 'Morning (7:30 AM - 12:00 PM)';
            } else if (totalMin >= 720 && totalMin < 1140) {
                return 'Afternoon (12:00 PM - 7:00 PM)';
            } else {
                return 'Overnight (7:00 PM - 7:30 AM)';
            }
        }

        function getOrCreateDeviceId() {
            try {
                let id = localStorage.getItem('radiology_station_id');
                if (!id) {
                    const rand = Math.floor(1000 + Math.random() * 9000);
                    id = `STATION-RAD-${rand}`;
                    localStorage.setItem('radiology_station_id', id);
                }
                return id;
            } catch(e) {
                return 'STATION-RAD-01';
            }
        }

        function formatDuration(totalSeconds) {
            if (!totalSeconds || isNaN(totalSeconds) || totalSeconds < 0) return '00:00';
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = Math.floor(totalSeconds % 60);
            if (hrs > 0) {
                return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatDateTimeLocal(isoStr) {
            if (!isoStr) return '';
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return isoStr;
                return d.toLocaleString('en-US', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                });
            } catch(e) {
                return isoStr;
            }
        }

        function formatTimeOnly(isoStr) {
            if (!isoStr) return '';
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return isoStr;
                return d.toLocaleTimeString('en-US', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                });
            } catch(e) {
                return isoStr;
            }
        }

        function flattenRecordForSheet(obs) {
            const handsOnSec = obs.summaryMetrics?.handsOnDurationSec || 0;
            const postSec = obs.summaryMetrics?.postProcessingDurationSec || 0;
            const totalSec = obs.summaryMetrics?.totalDurationSec || (handsOnSec + postSec);

            const microTimings = (obs.stepLogs || []).map((step, idx) => {
                const sStart = step.startTime ? formatTimeOnly(step.startTime) : '';
                const sEnd = step.endTime ? formatTimeOnly(step.endTime) : '';
                const timeSpan = (sStart && sEnd) ? ` (${sStart}-${sEnd})` : '';
                return `Step ${idx + 1} [${step.stepName}]: ${step.durationSeconds || 0}s${timeSpan}`;
            }).join(' | ');

            const timestampLogged = obs.timestampLogged ? formatDateTimeLocal(obs.timestampLogged) : formatDateTimeLocal(new Date().toISOString());
            const overallStartFormatted = obs.overallStartTime ? formatDateTimeLocal(obs.overallStartTime) : formatDateTimeLocal(new Date().toISOString());
            const overallEndFormatted = obs.overallEndTime ? formatDateTimeLocal(obs.overallEndTime) : formatDateTimeLocal(new Date().toISOString());

            const stationVal = obs.stationId || obs.observerName || 'STATION-RAD-01';
            const observerVal = obs.observerName || obs.stationId || 'STATION-RAD-01';
            const patientVal = obs.patientId || ('ACC-' + Math.floor(100000 + Math.random() * 900000));
            const shiftVal = obs.shift || getAutoDetectedShift();
            const modalityVal = obs.modality || 'CT';
            const contrastVal = obs.hasContrast ? 'Yes' : 'No';
            const patientTypeVal = obs.patientType || 'OPD';
            const bodyPartVal = obs.bodyPart || (modalityVal === 'CT' ? 'Brain' : 'Chest (1 view)');
            const templateVal = obs.templateName || (WORKFLOW_TEMPLATES[obs.templateKey]?.name || (modalityVal === 'CT' ? 'CT Scan' : 'X-Ray'));
            const filmSizeVal = obs.resources?.filmSize || '14x17';
            const filmsPrintedVal = obs.resources?.filmsPrinted ?? 0;
            const techCountVal = obs.resources?.techCount ?? 1;
            const nurseCountVal = obs.resources?.nurseCount ?? 0;
            const bottleneckVal = obs.resources?.bottleneckNotes || 'None';

            return {
                ...obs,
                timestampLogged,
                microStepTimings: microTimings,
                
                "Timestamp Logged": timestampLogged,
                "Observation ID": obs.id || '',
                "Station ID": stationVal,
                "Observer Name": observerVal,
                "Patient ID": patientVal,
                "Shift": shiftVal,
                "Modality": modalityVal,
                "IV Contrast": contrastVal,
                "Patient Type": patientTypeVal,
                "Body Region / Exam": bodyPartVal,
                "Workflow Template": templateVal,
                "Overall Start Time": overallStartFormatted,
                "Overall End Time": overallEndFormatted,
                "Total Sec": totalSec,
                "Hands-On Sec": handsOnSec,
                "Post-Proc Sec": postSec,
                "Total (mm:ss)": formatDuration(totalSec),
                "Hands-On (mm:ss)": formatDuration(handsOnSec),
                "Post-Proc (mm:ss)": formatDuration(postSec),
                "Films Printed": filmsPrintedVal,
                "Film Size": filmSizeVal,
                "Tech Count": techCountVal,
                "Nurse Count": nurseCountVal,
                "Bottlenecks / Notes": bottleneckVal,
                "Micro Step Timings": microTimings
            };
        }

        function QrScannerModal({ isOpen, onClose, onScanSuccess }) {
            const videoRef = React.useRef(null);
            const canvasRef = React.useRef(null);
            const [scanError, setScanError] = React.useState('');
            const [isScanning, setIsScanning] = React.useState(false);
            const [manualCode, setManualCode] = React.useState('');

            React.useEffect(() => {
                let stream = null;
                let animId = null;
                let isMounted = true;

                if (isOpen) {
                    setScanError('');
                    setIsScanning(true);
                    setManualCode('');

                    const constraints = {
                        video: {
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    };

                    navigator.mediaDevices?.getUserMedia(constraints)
                        .then((s) => {
                            if (!isMounted) {
                                s.getTracks().forEach(t => t.stop());
                                return;
                            }
                            stream = s;
                            if (videoRef.current) {
                                videoRef.current.srcObject = stream;
                                videoRef.current.setAttribute('playsinline', true);
                                videoRef.current.play().then(() => {
                                    if (isMounted) animId = requestAnimationFrame(tick);
                                }).catch(err => {
                                    console.error('Video play error:', err);
                                    if (isMounted) setScanError('Unable to start video preview. Please use manual entry below.');
                                });
                            }
                        })
                        .catch((err) => {
                            console.error('Camera access error:', err);
                            if (isMounted) {
                                setScanError('Camera permission denied or unavailable. Please enter code manually.');
                                setIsScanning(false);
                            }
                        });
                }

                function tick() {
                    if (!isMounted) return;
                    if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                        const video = videoRef.current;
                        const canvas = canvasRef.current;
                        if (canvas) {
                            const width = video.videoWidth;
                            const height = video.videoHeight;
                            if (width > 0 && height > 0) {
                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                                ctx.drawImage(video, 0, 0, width, height);
                                try {
                                    const imageData = ctx.getImageData(0, 0, width, height);
                                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                                        inversionAttempts: 'attemptBoth',
                                    });
                                    if (code && code.data) {
                                        triggerHaptic(60);
                                        onScanSuccess(code.data.trim());
                                        stopStream();
                                        return;
                                    }
                                } catch (e) {
                                    console.error('jsQR scanning error:', e);
                                }
                            }
                        }
                    }
                    if (isMounted) {
                        animId = requestAnimationFrame(tick);
                    }
                }

                function stopStream() {
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                    if (animId) {
                        cancelAnimationFrame(animId);
                    }
                }

                return () => {
                    isMounted = false;
                    stopStream();
                };
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4 text-center border border-slate-200">
                        <div className="flex items-center justify-between border-b pb-3">
                            <h3 className="font-extrabold text-sm text-slate-900 flex items-center space-x-2">
                                <i className="fa-solid fa-qrcode text-brand-600"></i>
                                <span>Scan Barcode / QR Code</span>
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <div className="relative rounded-2xl overflow-hidden bg-slate-900 aspect-video sm:aspect-square flex items-center justify-center border-2 border-brand-500/50 shadow-inner">
                            <video ref={videoRef} className="w-full h-full object-cover"></video>
                            <canvas ref={canvasRef} className="hidden"></canvas>
                            
                            {/* Scanner Targeting overlay box */}
                            <div className="absolute inset-8 border-2 border-dashed border-sky-400/80 rounded-2xl pointer-events-none flex items-center justify-center">
                                <div className="w-full h-0.5 bg-rose-500/80 animate-pulse"></div>
                            </div>

                            {scanError && (
                                <div className="absolute inset-0 bg-slate-950/95 p-6 flex flex-col items-center justify-center text-center">
                                    <i className="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-2"></i>
                                    <p className="text-xs text-white font-medium">{scanError}</p>
                                </div>
                            )}
                        </div>

                        <div className="space-y-2">
                            <p className="text-[11px] text-slate-500">
                                Center QR code within viewfinder or enter accession ID directly below:
                            </p>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    value={manualCode}
                                    onChange={(e) => setManualCode(e.target.value)}
                                    placeholder="Enter accession code..."
                                    className="flex-1 px-3 py-2 text-xs font-mono border rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500"
                                />
                                <button
                                    onClick={() => {
                                        if (manualCode.trim()) {
                                            triggerHaptic(40);
                                            onScanSuccess(manualCode.trim());
                                        }
                                    }}
                                    className="px-4 py-2 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-sm"
                                >
                                    Apply
                                </button>
                            </div>
                        </div>

                        <button
                            onClick={onClose}
                            className="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-xl transition"
                        >
                            Close Scanner
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [view, setView] = React.useState('setup'); // 'setup', 'tracking', 'resources', 'summary', 'history'
            const [stationId, setStationId] = React.useState(getOrCreateDeviceId());
            const [isStationLocked, setIsStationLocked] = React.useState(true);
            const [sheetsUrl, setSheetsUrl] = React.useState(() => {
                try { return localStorage.getItem('radiology_sheets_url') || HARDCODED_SHEETS_URL; }
                catch(e) { return HARDCODED_SHEETS_URL; }
            });
            const [showSettingsModal, setShowSettingsModal] = React.useState(false);
            const [showScannerModal, setShowScannerModal] = React.useState(false);
            const [isSyncing, setIsSyncing] = React.useState(false);
            const [lastSyncTime, setLastSyncTime] = React.useState(null);

            const [formData, setFormData] = React.useState({
                observerName: stationId,
                patientId: '',
                modality: 'XRay',
                hasContrast: 'no',
                bodyPart: 'Chest (1 view)',
                customBodyPart: '',
                xrayViews: 1,
                patientType: 'OPD',
                shift: getAutoDetectedShift(),
                isShiftOverridden: false
            });

            const [trackingSession, setTrackingSession] = React.useState(null);
            const [history, setHistory] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('radiology_history_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const [now, setNow] = React.useState(Date.now());
            const [toast, setToast] = React.useState({ show: false, message: '' });
            const [historySearch, setHistorySearch] = React.useState('');
            const [historyFilterModality, setHistoryFilterModality] = React.useState('ALL');

            React.useEffect(() => {
                try {
                    localStorage.setItem('radiology_history_v2', JSON.stringify(history));
                } catch(e) {}
            }, [history]);

            React.useEffect(() => {
                let interval = null;
                if (view === 'tracking') {
                    interval = setInterval(() => setNow(Date.now()), 1000);
                }
                return () => { if (interval) clearInterval(interval); };
            }, [view]);

            const showToast = (message) => {
                setToast({ show: true, message });
                setTimeout(() => setToast({ show: false, message: '' }), 3000);
            };

            const getTemplateKey = (modality, hasContrast) => {
                if (modality === 'CT') {
                    return hasContrast === 'yes' ? 'CT_WITH_CONTRAST' : 'CT_NO_CONTRAST';
                } else {
                    return hasContrast === 'yes' ? 'XRAY_WITH_CONTRAST' : 'XRAY_NO_CONTRAST';
                }
            };

            const sendToGoogleSheets = async (recordsToSync) => {
                if (!sheetsUrl || !recordsToSync || recordsToSync.length === 0) return false;
                setIsSyncing(true);
                try {
                    const flattened = recordsToSync.map(r => flattenRecordForSheet(r));
                    await fetch(sheetsUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(flattened)
                    });
                    setLastSyncTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
                    setIsSyncing(false);
                    return true;
                } catch (err) {
                    console.error('Sync failed:', err);
                    setIsSyncing(false);
                    return false;
                }
            };

            const handleStartObservation = (e) => {
                if (e) e.preventDefault();
                triggerHaptic(50);

                const effectiveObserver = formData.observerName.trim() || stationId.trim() || getOrCreateDeviceId();

                try {
                    localStorage.setItem('radiology_station_id', effectiveObserver);
                    setStationId(effectiveObserver);
                } catch(e) {}

                const templateKey = getTemplateKey(formData.modality, formData.hasContrast);
                const template = WORKFLOW_TEMPLATES[templateKey];
                const startTimeIso = new Date().toISOString();

                const initialLogs = template.steps.map((step, idx) => ({
                    stepId: step.id,
                    stepName: step.name,
                    stepType: step.type,
                    icon: step.icon,
                    status: idx === 0 ? 'in_progress' : 'pending',
                    startTime: idx === 0 ? startTimeIso : null,
                    endTime: null,
                    durationSeconds: 0,
                    note: ''
                }));

                const finalBodyPart = formData.bodyPart === 'Other' && formData.customBodyPart.trim()
                    ? `Other: ${formData.customBodyPart.trim()}`
                    : formData.bodyPart;

                const initialFilmCount = formData.modality === 'XRay' 
                    ? (parseInt(formData.xrayViews) || 1)
                    : 2;

                const session = {
                    id: 'OBS-' + Date.now().toString().slice(-6),
                    observerName: effectiveObserver,
                    stationId: effectiveObserver,
                    patientId: formData.patientId.trim() || ('ACC-' + Math.floor(100000 + Math.random() * 900000)),
                    modality: formData.modality,
                    hasContrast: formData.hasContrast === 'yes',
                    patientType: formData.patientType || 'OPD',
                    bodyPart: finalBodyPart,
                    xrayViews: formData.modality === 'XRay' ? formData.xrayViews : null,
                    shift: formData.shift || getAutoDetectedShift(),
                    templateKey: templateKey,
                    templateName: template.name,
                    overallStartTime: startTimeIso,
                    overallEndTime: null,
                    currentStepIndex: 0,
                    stepLogs: initialLogs,
                    syncedToSheet: false,
                    resources: {
                        filmsPrinted: initialFilmCount,
                        filmSize: '14x17',
                        techCount: 1,
                        nurseCount: formData.hasContrast === 'yes' ? 1 : 0,
                        bottleneckNotes: ''
                    }
                };

                setTrackingSession(session);
                setView('tracking');
                showToast(`Observation launched on ${effectiveObserver}!`);
            };

            const handleTapStepComplete = () => {
                triggerHaptic(40);
                if (!trackingSession) return;

                const logs = [...trackingSession.stepLogs];
                const currentIndex = trackingSession.currentStepIndex;
                const currentStep = logs[currentIndex];
                const nowIso = new Date().toISOString();

                const stepStart = new Date(currentStep.startTime || nowIso).getTime();
                const stepDurationSec = Math.max(1, Math.floor((Date.now() - stepStart) / 1000));

                logs[currentIndex] = {
                    ...currentStep,
                    status: 'completed',
                    endTime: nowIso,
                    durationSeconds: stepDurationSec
                };

                if (currentIndex + 1 < logs.length) {
                    logs[currentIndex + 1] = {
                        ...logs[currentIndex + 1],
                        status: 'in_progress',
                        startTime: nowIso
                    };

                    setTrackingSession({
                        ...trackingSession,
                        currentStepIndex: currentIndex + 1,
                        stepLogs: logs
                    });
                } else {
                    setTrackingSession({
                        ...trackingSession,
                        overallEndTime: nowIso,
                        stepLogs: logs
                    });
                    setView('resources');
                    showToast('All steps completed! Log study consumables.');
                }
            };

            const handleUndoLastStep = () => {
                triggerHaptic(30);
                if (!trackingSession || trackingSession.currentStepIndex === 0) return;

                const logs = [...trackingSession.stepLogs];
                const currentIndex = trackingSession.currentStepIndex;

                logs[currentIndex] = {
                    ...logs[currentIndex],
                    status: 'pending',
                    startTime: null,
                    endTime: null,
                    durationSeconds: 0
                };

                const prevIndex = currentIndex - 1;
                logs[prevIndex] = {
                    ...logs[prevIndex],
                    status: 'in_progress',
                    endTime: null
                };

                setTrackingSession({
                    ...trackingSession,
                    currentStepIndex: prevIndex,
                    stepLogs: logs
                });
            };

            const handleToggleBottleneck = (tag) => {
                triggerHaptic(20);
                if (!trackingSession) return;

                const currentNotes = trackingSession.resources.bottleneckNotes || '';
                let updatedNotes = '';

                if (currentNotes.includes(tag)) {
                    updatedNotes = currentNotes.replace(tag, '').replace(/,\s*,/g, ',').replace(/^,\s*|\s*,\s*$/g, '');
                } else {
                    updatedNotes = currentNotes ? `${currentNotes}, ${tag}` : tag;
                }

                setTrackingSession({
                    ...trackingSession,
                    resources: {
                        ...trackingSession.resources,
                        bottleneckNotes: updatedNotes
                    }
                });
            };

            const handleSaveResources = async (e) => {
                if (e) e.preventDefault();
                triggerHaptic(50);
                
                let handsOnSec = 0;
                let postSec = 0;

                const endTimeIso = trackingSession.overallEndTime || new Date().toISOString();

                trackingSession.stepLogs.forEach(log => {
                    if (log.stepType === 'hands_on') {
                        handsOnSec += log.durationSeconds;
                    } else {
                        postSec += log.durationSeconds;
                    }
                });

                const totalSec = handsOnSec + postSec;

                const baseRecord = {
                    ...trackingSession,
                    overallEndTime: endTimeIso,
                    timestampLogged: new Date().toISOString(),
                    syncedToSheet: false,
                    summaryMetrics: {
                        handsOnDurationSec: handsOnSec,
                        postProcessingDurationSec: postSec,
                        totalDurationSec: totalSec
                    }
                };

                const finalRecord = flattenRecordForSheet(baseRecord);

                let isSynced = false;
                if (sheetsUrl) {
                    isSynced = await sendToGoogleSheets([finalRecord]);
                }

                finalRecord.syncedToSheet = isSynced;

                setHistory([finalRecord, ...history]);
                setTrackingSession(finalRecord);
                setView('summary');
                showToast(isSynced ? "Saved & Live Synced to Google Sheets!" : "Saved locally (Offline mode).");
            };

            const handleStartNewPatient = () => {
                triggerHaptic(30);
                setFormData({
                    ...formData,
                    patientId: '',
                    shift: getAutoDetectedShift()
                });
                setTrackingSession(null);
                setView('setup');
            };

            const handleManualSyncAll = async () => {
                triggerHaptic(40);
                const unsynced = history.filter(item => !item.syncedToSheet);
                if (unsynced.length === 0) {
                    showToast("All observations are already synced!");
                    return;
                }

                const success = await sendToGoogleSheets(unsynced);
                if (success) {
                    const updated = history.map(item => ({ ...item, syncedToSheet: true }));
                    setHistory(updated);
                    showToast(`Successfully synced ${unsynced.length} records!`);
                } else {
                    showToast("Sync failed. Check connection or Apps Script URL.");
                }
            };

            const handleExportCSV = () => {
                triggerHaptic(30);
                if (history.length === 0) {
                    showToast("No history data to export.");
                    return;
                }

                const headers = Object.keys(history[0]).filter(k => typeof history[0][k] !== 'object');
                const csvRows = [
                    headers.join(','),
                    ...history.map(row => headers.map(h => JSON.stringify(row[h] || '')).join(','))
                ];

                const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', `Radiology_Time_Study_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast("CSV file exported successfully!");
            };

            const filteredHistory = history.filter(item => {
                const matchesSearch = !historySearch || 
                    (item.patientId || '').toLowerCase().includes(historySearch.toLowerCase()) ||
                    (item.stationId || '').toLowerCase().includes(historySearch.toLowerCase());
                const matchesModality = historyFilterModality === 'ALL' || item.modality === historyFilterModality;
                return matchesSearch && matchesModality;
            });

            return (
                <div className="max-w-md sm:max-w-xl mx-auto px-4 py-3 min-h-screen flex flex-col justify-between">
                    
                    {/* Header Bar */}
                    <header className="bg-white/80 backdrop-blur-md border border-slate-200/80 rounded-2xl p-3 shadow-card mb-3 flex items-center justify-between">
                        <div className="flex items-center space-x-2.5">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-sky-500 text-white flex items-center justify-center font-black text-lg shadow-glow">
                                <i className="fa-solid fa-microscope"></i>
                            </div>
                            <div>
                                <h1 className="text-xs font-black text-slate-900 tracking-tight flex items-center gap-1.5">
                                    <span>RAD TIME & MOTION</span>
                                    <span className="bg-sky-100 text-sky-800 text-[9px] px-1.5 py-0.2 rounded font-extrabold uppercase">CT & X-Ray</span>
                                </h1>
                                <p className="text-[10px] text-slate-500 font-semibold">Workflow Efficiency Tracker</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-1.5">
                            <button
                                onClick={() => { triggerHaptic(20); setShowSettingsModal(true); }}
                                className={`p-2 rounded-xl text-xs font-bold transition flex items-center space-x-1 ${
                                    isSyncing ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                }`}
                                title="Google Sheets Config"
                            >
                                <i className={`fa-solid ${isSyncing ? 'fa-spinner fa-spin text-amber-600' : 'fa-cloud text-brand-600'}`}></i>
                                <span className="hidden sm:inline text-[11px] font-extrabold">
                                    {lastSyncTime ? `Synced ${lastSyncTime}` : 'Sheets'}
                                </span>
                            </button>

                            <button
                                onClick={() => { triggerHaptic(20); setView(view === 'history' ? 'setup' : 'history'); }}
                                className={`px-3 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1 ${
                                    view === 'history' ? 'bg-brand-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                }`}
                            >
                                <i className="fa-solid fa-clock-rotate-left"></i>
                                <span>Logs ({history.length})</span>
                            </button>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-2 border border-slate-700 animate-bounce">
                            <i className="fa-solid fa-circle-info text-sky-400"></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* QR Code / Barcode Scanner Modal */}
                    <QrScannerModal
                        isOpen={showScannerModal}
                        onClose={() => setShowScannerModal(false)}
                        onScanSuccess={(scannedText) => {
                            setFormData(prev => ({ ...prev, patientId: scannedText.trim() }));
                            setShowScannerModal(false);
                            showToast(`Scanned Patient ID: ${scannedText.trim()}`);

                    />

                    {/* Google Sheets Modal */}
                    {showSettingsModal && (

                            <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-4 border border-slate-100">
                                <div className="flex items-center justify-between border-b pb-3">
                                    <h3 className="font-extrabold text-sm text-slate-900 flex items-center space-x-2">
                                        <i className="fa-solid fa-table text-emerald-600"></i>
                                        <span>Google Sheets Integration</span>
                                    </h3>
                                    <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600 p-1">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <p className="text-xs text-slate-500">
                                    Paste your Google Apps Script Web App URL below to sync observation data in real-time.
                                </p>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">Apps Script Endpoint URL</label>
                                    <input
                                        type="url"
                                        value={sheetsUrl}
                                        onChange={(e) => setSheetsUrl(e.target.value)}
                                        placeholder="https://script.google.com/macros/s/.../exec"
                                        className="w-full text-xs font-mono p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none"
                                    />
                                </div>

                                <div className="flex space-x-2 pt-2">
                                    <button
                                        onClick={() => {
                                            try { localStorage.setItem('radiology_sheets_url', sheetsUrl); } catch(e){}
                                            setShowSettingsModal(false);
                                            showToast("Google Sheets Web App URL Saved!");
                                        }}
                                        className="flex-1 py-3 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md"
                                    >
                                        Save Configuration
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Setup View */}
                    {view === 'setup' && (
                        <div className="bg-white/90 backdrop-blur-md rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-card space-y-5 my-auto">
                            <form onSubmit={handleStartObservation} className="space-y-4">
                                
                                {/* Machine / Station ID Input */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div className="bg-slate-50/70 p-3.5 rounded-2xl border border-slate-200/60">
                                        <div className="flex items-center justify-between mb-1.5">
                                            <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                                <i className="fa-solid fa-desktop text-brand-600"></i>
                                                <span>Machine / Station ID</span>
                                            </label>
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    triggerHaptic(20);
                                                    if (!isStationLocked) {
                                                        const val = formData.observerName.trim() || stationId;
                                                        setStationId(val);
                                                        setFormData({...formData, observerName: val});
                                                        try { localStorage.setItem('radiology_station_id', val); } catch(e){}
                                                    }
                                                    setIsStationLocked(!isStationLocked);
                                                }}
                                                className="text-[10px] font-black px-2 py-0.5 rounded-md transition flex items-center gap-1 bg-slate-200 text-slate-700 hover:bg-slate-300"
                                            >
                                                <i className={`fa-solid ${isStationLocked ? 'fa-lock text-emerald-600' : 'fa-lock-open text-amber-600'}`}></i>
                                                <span>{isStationLocked ? 'Locked' : 'Edit Station'}</span>
                                            </button>
                                        </div>

                                        {isStationLocked ? (
                                            <div className="flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-emerald-200 bg-emerald-50/60 shadow-inner">
                                                <div className="flex items-center space-x-2">
                                                    <i className="fa-solid fa-shield-halved text-emerald-600 text-sm"></i>
                                                    <span className="font-mono font-extrabold text-sm text-emerald-950">{stationId}</span>
                                                </div>
                                                <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">
                                                    Auto-Saved
                                                </span>
                                            </div>
                                        ) : (
                                            <input 
                                                type="text" 
                                                required
                                                value={formData.observerName}
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setFormData({...formData, observerName: val});
                                                    setStationId(val);
                                                }}
                                                placeholder="e.g. STATION-CT-01"
                                                className="w-full px-3.5 py-2.5 text-sm font-semibold rounded-xl border border-amber-300 bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition shadow-sm"
                                            />
                                        )}
                                    </div>

                                    <div className="bg-slate-50/70 p-3.5 rounded-2xl border border-slate-200/60">
                                        <div className="flex items-center justify-between mb-1.5">
                                            <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                                <i className="fa-solid fa-id-badge text-indigo-600"></i>
                                                <span>Accession / Patient Code</span>
                                            </label>
                                            <button
                                                type="button"
                                                onClick={() => { triggerHaptic(30); setShowScannerModal(true); }}
                                                className="px-2.5 py-1 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-[10px] font-black flex items-center space-x-1 shadow-sm transition active:scale-95"
                                            >
                                                <i className="fa-solid fa-camera"></i>
                                                <span>Scan QR</span>
                                            </button>
                                        </div>
                                        <input 
                                            type="text" 
                                            value={formData.patientId}
                                            onChange={(e) => setFormData({...formData, patientId: e.target.value})}
                                            placeholder="e.g. ACC-882391 (Auto if empty)"
                                            className="w-full px-3.5 py-2.5 text-sm font-mono font-bold rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition shadow-sm"
                                        />
                                    </div>
                                </div>

                                {/* Modality Selection: CT vs X-Ray */}
                                <div className="space-y-2">
                                    <label className="block text-xs font-black text-slate-800 tracking-wide uppercase">
                                        1. Modality Selection
                                    </label>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                triggerHaptic(35);
                                                setFormData({ ...formData, modality: 'CT', bodyPart: 'Brain' });
                                            }}
                                            className={`p-4 rounded-3xl border-2 transition-all duration-200 active:scale-95 text-left relative overflow-hidden flex flex-col justify-between ${
                                                formData.modality === 'CT'
                                                    ? 'border-indigo-500 bg-gradient-to-br from-indigo-50 via-sky-50/50 to-white text-indigo-950 shadow-md ring-2 ring-indigo-500/20'
                                                    : 'border-slate-200/80 bg-white text-slate-600 hover:border-slate-300'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between mb-2">
                                                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-lg transition-all ${
                                                    formData.modality === 'CT' ? 'bg-indigo-600 text-white shadow-glow' : 'bg-slate-100 text-slate-600'
                                                }`}>
                                                    <i className="fa-solid fa-ring"></i>
                                                </div>
                                                {formData.modality === 'CT' && (
                                                    <span className="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs">
                                                        <i className="fa-solid fa-check"></i>
                                                    </span>
                                                )}
                                            </div>
                                            <div>
                                                <div className="font-extrabold text-sm">CT Scan</div>
                                                <div className="text-[10px] text-slate-500 font-medium">Computed Tomography</div>
                                            </div>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => {
                                                triggerHaptic(35);
                                                setFormData({ ...formData, modality: 'XRay', bodyPart: 'Chest (1 view)', xrayViews: 1 });
                                            }}
                                            className={`p-4 rounded-3xl border-2 transition-all duration-200 active:scale-95 text-left relative overflow-hidden flex flex-col justify-between ${
                                                formData.modality === 'XRay'
                                                    ? 'border-brand-500 bg-gradient-to-br from-brand-50 via-sky-50/50 to-white text-brand-950 shadow-md ring-2 ring-brand-500/20'
                                                    : 'border-slate-200/80 bg-white text-slate-600 hover:border-slate-300'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between mb-2">
                                                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-lg transition-all ${
                                                    formData.modality === 'XRay' ? 'bg-brand-600 text-white shadow-glow' : 'bg-slate-100 text-slate-600'
                                                }`}>
                                                    <i className="fa-solid fa-x-ray"></i>
                                                </div>
                                                {formData.modality === 'XRay' && (
                                                    <span className="w-5 h-5 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs">
                                                        <i className="fa-solid fa-check"></i>
                                                    </span>
                                                )}
                                            </div>
                                            <div>
                                                <div className="font-extrabold text-sm">X-Ray Scan</div>
                                                <div className="text-[10px] text-slate-500 font-medium">General Radiography</div>
                                            </div>
                                        </button>
                                    </div>
                                </div>

                                {/* Contrast Administration Toggle */}
                                <div className="space-y-2">
                                    <label className="block text-xs font-black text-slate-800 tracking-wide uppercase">
                                        2. Contrast Administration
                                    </label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            type="button"
                                            onClick={() => { triggerHaptic(20); setFormData({...formData, hasContrast: 'no'}); }}
                                            className={`py-3 px-4 rounded-2xl font-bold text-xs border transition flex items-center justify-center space-x-2 ${
                                                formData.hasContrast === 'no'
                                                    ? 'bg-slate-800 text-white border-slate-800 shadow-sm'
                                                    : 'bg-white text-slate-600 border-slate-200'
                                            }`}
                                        >
                                            <i className="fa-solid fa-ban"></i>
                                            <span>No Contrast (Plain)</span>
                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => { triggerHaptic(20); setFormData({...formData, hasContrast: 'yes'}); }}
                                            className={`py-3 px-4 rounded-2xl font-bold text-xs border transition flex items-center justify-center space-x-2 ${
                                                formData.hasContrast === 'yes'
                                                    ? 'bg-purple-600 text-white border-purple-600 shadow-sm'
                                                    : 'bg-white text-slate-600 border-slate-200'
                                            }`}
                                        >
                                            <i className="fa-solid fa-syringe"></i>
                                            <span>IV Contrast Enhanced</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Anatomy / Region Selection */}
                                <div className="space-y-2">
                                    <label className="block text-xs font-black text-slate-800 tracking-wide uppercase">
                                        3. Body Anatomy Region
                                    </label>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        {(formData.modality === 'CT' ? CT_REGIONS : XRAY_REGIONS).map((reg) => (
                                            <button
                                                key={reg.id}
                                                type="button"
                                                onClick={() => {
                                                    triggerHaptic(20);
                                                    setFormData({
                                                        ...formData,
                                                        bodyPart: reg.name,
                                                        xrayViews: reg.views || formData.xrayViews
                                                    });
                                                }}
                                                className={`p-3 rounded-2xl text-xs font-bold text-left border transition flex flex-col justify-between ${
                                                    formData.bodyPart === reg.name
                                                        ? 'bg-sky-50 border-sky-500 text-sky-950 ring-2 ring-sky-500/20'
                                                        : 'bg-white border-slate-200 text-slate-700 hover:border-slate-300'

                                            >
                                                <i className={`fa-solid ${reg.icon} text-sm mb-2 text-sky-600`}></i>
                                                <span>{reg.label}</span>

                                    {formData.bodyPart === 'Other' && (

                                            <input
                                                type="text"

                                                onChange={(e) => setFormData({...formData, customBodyPart: e.target.value})}
                                                placeholder="Enter custom region name..."
                                                className="w-full px-3.5 py-2.5 text-xs font-semibold rounded-xl border border-sky-300 bg-sky-50/50 focus:outline-none focus:ring-2 focus:ring-sky-500"
                                            />
                                        </div>

                                </div>

                                {/* Patient Type Pills */}
                                <div className="space-y-2">
